<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} - 每日一题</title>
<link rel="stylesheet" href="/lib/codemirror.min.css">
<link rel="stylesheet" href="/lib/dracula.css">
<style>
  :root {
    --bg: #0f0f14; --code-bg: #1e1e2e; --border: #2a2a3a;
    --text: #e0e0e0; --text-muted: #777; --accent: #6c5ce7;
    --green: #00b894; --yellow: #fdcb6e; --red: #e17055;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; display: flex;
  }
  /* ── left panel ── */
  .left-panel {
    padding: 24px; overflow-y: auto; background: #12121a;
    flex: 1 1 0; min-width: 280px; max-width: 42%;
  }
  .left-panel h2 { font-size: 1.2rem; margin-bottom: 4px; }
  .difficulty-tag {
    display: inline-block; font-size: 0.72rem; padding: 2px 10px;
    border-radius: 4px; margin-bottom: 16px;
  }
  .difficulty-tag.easy{background:#1a3a2a;color:var(--green)}
  .difficulty-tag.medium{background:#3a2a1a;color:var(--yellow)}
  .difficulty-tag.hard{background:#3a1a1a;color:var(--red)}

  .desc-block {
    background: #1a1a28; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px;
    font-size: 0.88rem; line-height: 1.65; white-space: pre-wrap;
  }
  .examples-section{margin-bottom:16px}
  .examples-section h3{font-size:0.78rem;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
  .example-card{
    background:#1a1a28;border:1px solid var(--border);border-radius:8px;
    padding:12px 14px;margin-bottom:8px;
  }
  .example-num{font-size:0.72rem;color:var(--accent);margin-bottom:6px;font-weight:600}
  .example-row{display:flex;gap:8px;margin-bottom:3px;font-size:0.82rem;line-height:1.5}
  .example-row .ex-label{color:var(--text-muted);min-width:30px;font-size:0.72rem;flex-shrink:0}
  .example-row code{color:var(--green);font-family:"SF Mono","Monaco","Menlo",monospace;font-size:0.82rem}
  .example-row .ex-text{color:var(--text-muted)}

  /* walkthrough table */
  .walkthrough-block {
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow-x: auto; margin-bottom: 16px;
  }
  .walkthrough-block h3 {
    font-size: 0.78rem; color: var(--text-muted);
    padding: 10px 14px 0; text-transform: uppercase; letter-spacing: 1px;
  }
  .walk-table {
    width: 100%; border-collapse: collapse; font-size: 0.76rem;
  }
  .walk-table th {
    padding: 6px 8px; background: #1a1a28; color: var(--text-muted);
    font-weight: 500; text-align: left; white-space: nowrap;
    position: sticky; top: 0;
  }
  .walk-table td {
    padding: 6px 8px; border-top: 1px solid var(--border);
    vertical-align: top; line-height: 1.5;
  }
  .walk-table .step-tag {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    background: #2d1f5e; color: var(--accent); font-weight: 600;
    white-space: nowrap;
  }
  .walk-table .hash-state {
    color: var(--yellow); font-size: 0.74rem;
  }
  .walk-table .walk-found td {
    background: #0a2a1a;
  }
  .walk-table .walk-found .step-tag {
    background: var(--green); color: #fff;
  }

  /* approach section */
  .approach-section {
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 12px;
  }
  .approach-header {
    padding: 10px 14px; background: #1a1a28; display: flex;
    justify-content: space-between; align-items: center;
  }
  .approach-header h4 {
    font-size: 0.85rem; color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .approach-header .toggle-arrow {
    transition: transform 0.2s; font-size: 0.7rem; color: var(--text-muted);
  }
  .approach-header .toggle-arrow.open { transform: rotate(90deg); }
  .approach-body {
    display: block; padding: 0; border-top: 1px solid var(--border);
    font-size: 0.82rem; line-height: 1.6;
  }
  .approach-body.collapsed { display: none; }

  .approach-compare {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
  }
  .approach-card {
    padding: 14px; position: relative;
  }
  .approach-card.rejected {
    background: #1a1515; border-right: 1px solid var(--border);
  }
  .approach-card.accepted {
    background: #0a2a1a;
  }
  .approach-card .verdict {
    position: absolute; top: 10px; right: 12px;
    font-size: 1.2rem;
  }
  .approach-card .card-title {
    font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;
    padding-right: 24px;
  }
  .approach-card.rejected .card-title { color: var(--red); }
  .approach-card.accepted .card-title { color: var(--green); }
  .approach-card .card-idea {
    font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px;
  }
  .approach-card .complexity-tag {
    display: inline-block; padding: 2px 10px; border-radius: 4px;
    font-size: 0.72rem; font-weight: 600;
  }
  .approach-card.rejected .complexity-tag {
    background: #3a1a1a; color: var(--red);
  }
  .approach-card.accepted .complexity-tag {
    background: #1a3a2a; color: var(--green);
  }
  .approach-card .flow {
    margin-top: 8px; font-size: 0.76rem; color: var(--text);
    font-family: "SF Mono","Monaco","Menlo",monospace;
    background: rgba(0,0,0,0.2); padding: 6px 10px; border-radius: 4px;
  }

  /* playback trigger button */
  .playback-trigger {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 10px 14px; margin-top: 10px;
    background: linear-gradient(135deg, rgba(108,92,231,0.3), rgba(108,92,231,0.1));
    border: 1px solid rgba(108,92,231,0.4); border-radius: 8px;
    color: #fff; cursor: pointer; font-size: 0.82rem; font-weight: 600;
    transition: all 0.15s;
  }
  .playback-trigger:hover { background: rgba(108,92,231,0.25); border-color: var(--accent); }
  .playback-trigger .pb-icon { font-size: 1.1rem; }

  /* ── modal overlay ── */
  .modal-overlay {
    display: none;
    position: fixed !important;
    top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
    width: 100vw !important; height: 100vh !important;
    background: rgba(0, 0, 0, 0.85);
    z-index: 9999 !important;
    justify-content: center; align-items: center;
  }
  .modal-overlay.open { display: flex !important; }
  .modal-dialog {
    background: linear-gradient(145deg, #1a1a28, #12121a);
    border: 1px solid rgba(108, 92, 231, 0.4);
    border-radius: 16px;
    width: min(95vw, 1150px); height: min(85vh, 680px);
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow:
      0 0 40px rgba(108, 92, 231, 0.25),
      0 20px 60px rgba(0, 0, 0, 0.7),
      inset 0 1px 0 rgba(255, 255, 255, 0.02);
    animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.92) translateY(-10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px;
    background: linear-gradient(180deg, rgba(108,92,231,0.1), transparent);
    border-bottom: 1px solid rgba(108, 92, 231, 0.2);
    flex-shrink: 0;
  }
  .modal-titlebar h3 { font-size: 1rem; letter-spacing: 0.3px; }
  .modal-titlebar .close-modal {
    width: 32px; height: 32px; border-radius: 8px; border: none;
    background: rgba(255,255,255,0.05); color: var(--text-muted);
    font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .modal-titlebar .close-modal:hover { background: rgba(255,0,0,0.15); color: var(--red); }

  .modal-body { flex: 1; display: flex; overflow: hidden; min-height: 0; }

  .modal-controls {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 12px 20px;
    border-top: 1px solid rgba(108, 92, 231, 0.2);
    background: rgba(108, 92, 231, 0.04);
    flex-shrink: 0;
  }
  .modal-controls button {
    padding: 7px 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
    background: rgba(255,255,255,0.03); color: var(--text); font-size: 0.82rem;
    cursor: pointer; transition: all 0.15s;
  }
  .modal-controls button:hover { border-color: var(--accent); background: rgba(108,92,231,0.1); }
  .modal-controls button:disabled { opacity: 0.2; cursor: default; }


  .modal-code-panel {
    width: 45%; overflow-y: auto; border-right: 1px solid rgba(108,92,231,0.15);
    background: rgba(0,0,0,0.2); padding: 0; flex-shrink: 0;
  }
  .modal-code-panel .CodeMirror { height: 100% !important; }
  .modal-viz-panel {
    flex: 1; padding: 14px 18px; overflow-y: auto; display: flex;
    flex-direction: column; gap: 10px; background: rgba(0,0,0,0.1);
  }
  .modal-viz-panel .step-indicator { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
  .modal-viz-panel .step-dot {
    width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.08);
    cursor: pointer; transition: all 0.2s;
  }
  .modal-viz-panel .step-dot.done { background: var(--accent); }
  .modal-viz-panel .step-dot.current { background: #fff; transform: scale(1.4); box-shadow: 0 0 8px rgba(255,255,255,0.3); }
  .modal-viz-panel .step-dot.found { background: var(--green); }

  .modal-hint-box {
    background: rgba(108,92,231,0.06); border: 1px solid rgba(108,92,231,0.15);
    border-radius: 10px; padding: 14px 16px; font-size: 0.85rem; line-height: 1.6;
  }
  .modal-hint-box .hint-step-num { font-size: 0.7rem; color: var(--accent); margin-bottom: 4px; }
  .modal-hint-box .hint-text { font-size: 0.88rem; color: var(--text); }
  .modal-hint-box .hint-text.found-status { color: var(--green); font-weight: 700; }

  /* ── Walkthrough 可视化：数组盒子 + 哈希表 ── */
  .viz-section { margin-bottom: 10px; }
  .viz-section-title {
    font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;
    margin-bottom: 6px; letter-spacing: 0.5px;
  }
  .viz-array { display: flex; gap: 6px; flex-wrap: wrap; }
  .viz-array-box {
    width: 52px; height: 52px; border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08);
    transition: all 0.3s ease; position: relative;
  }
  .viz-array-box .val { font-size: 1.05rem; font-weight: 700; color: var(--text); }
  .viz-array-box .idx { font-size: 0.62rem; color: var(--text-muted); margin-top: 1px; }
  .viz-array-box.current {
    border-color: var(--accent); background: rgba(108,92,231,0.12);
    transform: scale(1.08); box-shadow: 0 0 12px rgba(108,92,231,0.3);
  }
  .viz-array-box.processed {
    border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.06);
  }
  .viz-array-box.found { border-color: var(--green); background: rgba(46,204,113,0.12); }
  .viz-arrow {
    position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
    font-size: 0.65rem; color: var(--accent);
  }

  .viz-hashmap { display: flex; gap: 6px; flex-wrap: wrap; min-height: 44px; align-items: center; }
  .viz-hashmap-empty { font-size: 0.78rem; color: var(--text-muted); font-style: italic; }
  .viz-hash-box {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 8px;
    background: rgba(108,92,231,0.08); border: 1px solid rgba(108,92,231,0.2);
    font-size: 0.82rem; font-weight: 600;
    transition: all 0.3s ease;
  }
  .viz-hash-box .key { color: var(--accent); }
  .viz-hash-box .arrow { color: var(--text-muted); font-size: 0.75rem; }
  .viz-hash-box .val { color: var(--text); }
  .viz-hash-box.new {
    animation: hashInsert 0.4s ease;
    border-color: var(--green); background: rgba(46,204,113,0.1);
  }
  @keyframes hashInsert {
    0% { transform: scale(0.6); opacity: 0; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ── Input/Output banner ── */
  .viz-info-banner {
    padding: 10px 14px; margin-bottom: 8px;
    background: rgba(108,92,231,0.06); border: 1px solid rgba(108,92,231,0.12);
    border-radius: 8px; font-size: 0.78rem; display: flex; flex-wrap: wrap; gap: 10px;
  }
  .viz-info-row { display: flex; align-items: center; gap: 6px; }
  .viz-info-label { color: var(--accent); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; }
  .viz-info-banner code {
    font-family: "SF Mono","Monaco",monospace; font-size: 0.78rem;
    background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 4px;
  }

  .viz-compute {
    padding: 10px 14px; border-radius: 8px; margin-bottom: 8px;
    background: rgba(108,92,231,0.06); border: 1px solid rgba(108,92,231,0.12);
    font-size: 0.82rem; line-height: 1.6;
  }
  .viz-compute .formula { color: var(--accent); font-weight: 600; }
  .viz-compute .result-found { color: var(--green); font-weight: 700; }
  .viz-compute .result-miss { color: var(--text-muted); }

  /* ── 补数等式卡片 ── */
  .viz-equation {
    padding: 14px 18px; margin-bottom: 10px;
    background: rgba(108,92,231,0.08); border: 2px solid rgba(108,92,231,0.2);
    border-radius: 10px; text-align: center;
  }
  .viz-equation .eq-row {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 1.15rem; font-weight: 700; flex-wrap: wrap;
  }
  .viz-equation .eq-target { color: var(--accent); font-size: 1.3rem; }
  .viz-equation .eq-current { color: var(--text); background: rgba(108,92,231,0.15); padding: 4px 12px; border-radius: 6px; }
  .viz-equation .eq-operator { color: var(--text-muted); font-size: 0.9rem; }
  .viz-equation .eq-result {
    color: var(--green); font-size: 1.5rem;
    padding: 6px 16px; border: 2px dashed var(--green);
    border-radius: 8px; background: rgba(46,204,113,0.08);
    animation: pulse 1.2s ease infinite;
  }

  /* ── 查找连线指示 ── */
  .viz-lookup {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin-bottom: 10px; padding: 8px 0; font-size: 0.8rem;
  }
  .viz-lookup .lookup-icon { font-size: 1.2rem; }
  .viz-lookup .lookup-dest {
    padding: 4px 14px; border-radius: 6px; font-weight: 700; font-size: 0.9rem;
  }
  .viz-lookup .lookup-dest.miss {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted);
  }
  .viz-lookup .lookup-dest.hit {
    background: rgba(46,204,113,0.12); border: 1px solid var(--green); color: var(--green);
  }

  .viz-hash-box.hit {
    border-color: var(--green) !important; background: rgba(46,204,113,0.12) !important;
    box-shadow: 0 0 8px rgba(46,204,113,0.2);
  }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .modal-state-table {
    border: 1px solid rgba(108,92,231,0.1); border-radius: 10px; overflow: hidden; font-size: 0.8rem;
  }
  .modal-state-table table { width: 100%; border-collapse: collapse; }
  .modal-state-table th {
    padding: 7px 12px; background: rgba(108,92,231,0.1);
    color: var(--text-muted); font-weight: 500; text-align: left;
  }
  .modal-state-table td {
    padding: 6px 12px; border-top: 1px solid rgba(255,255,255,0.04);
    transition: background 0.2s;
  }
  .modal-state-table .step-current { background: rgba(108, 92, 231, 0.12); }

  /* CodeMirror line highlights (in modal) */
  .cm-active { background: rgba(108, 92, 231, 0.25) !important; }
  .cm-found { background: rgba(0, 184, 148, 0.2) !important; }

  .example-picker {
    display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-shrink: 0;
  }
  .example-picker span { font-size: 0.72rem; color: var(--text-muted); }
  .example-picker code { font-size: 0.78rem; color: var(--yellow); background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius:4px; }

  .state-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 6px; margin-top: 10px;
  }
  .state-grid div {
    background: rgba(0,0,0,0.2); border-radius: 6px; padding: 6px 10px;
  }
  .state-grid div span {
    display: block; font-size: 0.68rem; color: var(--text-muted);
  }
  .state-grid div strong {
    font-size: 1rem; color: var(--accent);
  }
  .state-grid div code {
    color: var(--yellow); font-size: 0.82rem;
  }

  /* ── right panel ── */
  .right-panel {
    flex: 1.5 1 0; min-width: 340px; display: flex; flex-direction: column;
    overflow-y: auto; background: var(--bg);
  }
  .v-splitter {
    width: 6px; cursor: col-resize; background: #1a1a28;
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .v-splitter:hover { background: #2a2a40; }
  .v-splitter:active { background: var(--accent); }
  .v-splitter .grip-v {
    width: 2px; height: 28px; background: var(--text-muted); border-radius: 1px;
  }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: #12121a; position: sticky; top: 0; z-index: 10;
  }
  .topbar .back-btn{ padding:5px 10px;border:1px solid var(--border);border-radius:6px; color:var(--text-muted);text-decoration:none;font-size:0.8rem; }
  .topbar .back-btn:hover{border-color:var(--accent);color:var(--text)}
  .lang-tabs{display:flex;gap:4px}
  .lang-tab{ padding:4px 12px;border:1px solid var(--border);border-radius:5px; background:transparent;color:var(--text-muted);font-size:0.78rem;cursor:pointer; }
  .lang-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .progress-toggle{display:flex;gap:5px;margin-left:auto}
  .progress-toggle button{ padding:4px 10px;border:1px solid var(--border);border-radius:5px; background:transparent;color:var(--text-muted);font-size:0.72rem;cursor:pointer; }
  .progress-toggle button.done{border-color:var(--green);color:var(--green)}
  .progress-toggle button.done:hover{background:var(--green);color:#fff}
  .progress-toggle button.review{border-color:var(--yellow);color:var(--yellow)}
  .progress-toggle button.review:hover{background:var(--yellow);color:#111}

  .code-body{flex:1;padding:16px 20px;overflow-y:auto}

  .CodeMirror {
    height: auto !important; min-height: 260px;
    font-family: "SF Mono","Monaco","Menlo",monospace; font-size: 14px; border-radius: 8px;
  }
  .editor-hint{ padding:6px 14px;font-size:0.72rem;color:var(--text-muted);display:flex;justify-content:space-between; }

  .answer-section{ border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin:14px 0; }
  .answer-toggle{ width:100%;padding:10px 16px;background:#1a1a28;border:none;color:var(--text);text-align:left;cursor:pointer;font-size:0.85rem;display:flex;justify-content:space-between; }
  .answer-toggle:hover{background:#222238}
  .answer-toggle .arrow-a{transition:transform 0.2s;font-size:0.7rem}
  .answer-toggle.expanded .arrow-a{transform:rotate(90deg)}
  .answer-body{display:none;border-top:1px solid var(--border);}
  .answer-body.visible{display:block}

  .section-box{ background:#1a1a28;border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px; }
  .section-box h4{font-size:0.8rem;color:var(--yellow);margin-bottom:4px}
  .bullet-list{padding-left:16px;font-size:0.8rem;color:var(--text-muted)}
  .bullet-list li{margin-bottom:3px}
  .bullet-list li b{color:var(--accent)}

  @media(max-width:768px){ body{flex-direction:column} .left-panel,.right-panel{flex:none;width:100%!important;min-width:0;max-width:none} .v-splitter{display:none} }
</style>
</head>
<body>

<div class="left-panel">
  <h2>{{TITLE}}</h2>
  <span class="difficulty-tag {{DIFFICULTY_CLASS}}">{{DIFFICULTY}}</span>
  <div class="desc-block">{{DESCRIPTION}}</div>
  {{EXAMPLES}}

  <div class="section-box">
    <h4>🧠 关键点</h4>
    <ul class="bullet-list">{{KEYPOINTS}}</ul>
  </div>
  <div class="section-box">
    <h4>⚠️ 易错点</h4>
    <ul class="bullet-list">{{GOTCHAS}}</ul>
  </div>
</div>

<div class="v-splitter" id="vSplitter"><div class="grip-v"></div></div>

<div class="right-panel">
  <div class="topbar">

    <div class="lang-tabs">
      <button class="lang-tab active" data-lang="python" onclick="switchLang('python')">Python</button>

    <div class="progress-toggle">
      <button class="done" onclick="markStatus('done')">✓ 掌握</button>
      <button class="review" onclick="markStatus('review')">⚠ 复习</button>

  <div class="code-body">
    <div id="editor-python">
      <textarea id="codePython">{{CODE_PYTHON}}</textarea>
      <div class="editor-hint"><span>在此编写 Python 代码</span><span>自动保存到本地</span></div>

    <div id="editor-java" style="display:none">

        <div class="approach-compare">
          {{APPROACH_CARDS}}
        </div>
        <button class="playback-trigger" id="playbackTrigger" onclick="openPlayback()" style="margin-top:10px;width:100%">
          <span class="pb-icon">🎮</span> 步骤演示

<!-- ═══════════════════════════════════════════════════ -->

<div class="modal-overlay" id="playbackModal">
  <div class="modal-dialog">
    <div class="modal-titlebar">
      <h3>🎮 执行过程回放 · {{TITLE}}</h3>
      <button class="close-modal" onclick="closePlayback()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="modal-code-panel"><textarea id="walkthroughCodeTA" style="display:none"></textarea></div>
      <div class="modal-viz-panel" id="modalVizPanel"></div>
    </div>
    <div class="modal-controls">
      <button onclick="playerPrev()" id="btnPrev">⏮ 上一步</button>
      <button onclick="playerReset()" id="btnReset">↻ 重置</button>
      <button onclick="playerNext()" id="btnNext">下一步 ⏭</button>
      <span style="font-size:0.72rem;color:var(--text-muted);margin-left:8px" id="stepCounter">0/0</span>
    </div>
  </div>
</div>

<!-- Walkthrough data (injected by render.py) -->
<script>
var WALKTHROUGH_DATA = null;
try {
  var _rawData = {{WALKTHROUGH_STEPS_JSON}};
  if (_rawData && typeof _rawData === "object") WALKTHROUGH_DATA = _rawData;
} catch(e) { WALKTHROUGH_DATA = null; }
// Always show the button — openPlayback handles missing data gracefully
console.log("[algo-practice] walkthrough player loaded, steps:", WALKTHROUGH_DATA ? WALKTHROUGH_DATA.steps.length : 0, "| page build: {{BUILD_TIME}}");
</script>

<script src="/shared/progress.js"></script>
<script src="/shared/splitter.js"></script>
<script src="/lib/codemirror.min.js"></script>
<script src="/lib/mode/python.min.js"></script>
<script src="/lib/mode/clike.min.js"></script>
<script>
var PROBLEM_ID = "{{PROBLEM_ID}}";
var PROBLEM_TYPE = "algo";
</script>
<script src="/shared/progress.js"></script>
<script src="/shared/splitter.js"></script>
<script>
initProgress();

var STORAGE_KEY_PY = "algo_code_" + PROBLEM_ID + "_python";
var STORAGE_KEY_JA = "algo_code_" + PROBLEM_ID + "_java";

// ── Create CodeMirror editors ──
function makeEditor(id, mode) {
  var ta = document.getElementById(id);
  var saved = null;
  if (id === "codePython") {
    try { saved = localStorage.getItem(STORAGE_KEY_PY); } catch(e) {}
  } else if (id === "codeJava") {
    try { saved = localStorage.getItem(STORAGE_KEY_JA); } catch(e) {}
  }
  if (saved) ta.value = saved;
  return CodeMirror.fromTextArea(ta, {
    mode: mode, theme: "dracula", lineNumbers: true,
    matchBrackets: true, autoCloseBrackets: true,
    indentUnit: 4, tabSize: 4, indentWithTabs: false,
    smartIndent: true, electricChars: true, lineWrapping: false,
  });
}

var pyEditor = makeEditor("codePython", "python");
var jaEditor = makeEditor("codeJava", "text/x-java");
var pyAnswer = makeEditor("answerCodePython", "python");
pyAnswer.setOption("readOnly", true);
var jaAnswer = makeEditor("answerCodeJava", "text/x-java");
jaAnswer.setOption("readOnly", true);

// ── Auto-save ──
(function() {
  var ac = "change";
  pyEditor.on(ac, function() {
    try { localStorage.setItem(STORAGE_KEY_PY, pyEditor.getValue()); } catch(e) {}
  });
  jaEditor.on(ac, function() {
    try { localStorage.setItem(STORAGE_KEY_JA, jaEditor.getValue()); } catch(e) {}
  });
})();

// ── Tab switch ──
var activeLang = "python";
function switchLang(lang) {
  activeLang = lang;
  document.querySelectorAll(".lang-tab").forEach(function(t) { t.classList.remove("active"); });
  document.querySelector('.lang-tab[data-lang="' + lang + '"]').classList.add("active");
  document.getElementById("editor-python").style.display = lang === "python" ? "block" : "none";
  document.getElementById("editor-java").style.display = lang === "java" ? "block" : "none";
  document.getElementById("answer-python-view").style.display = lang === "python" ? "block" : "none";
  document.getElementById("answer-java-view").style.display = lang === "java" ? "block" : "none";
  // 如果 walkthrough modal 开着，刷新代码面板
  var modal = document.getElementById("playbackModal");
  if (modal.classList.contains("open")) {
    renderCodePanel();
  }
  setTimeout(function() {
    (lang === "python" ? pyEditor : jaEditor).refresh();
    // 如果答案面板开着，刷新新 Tab 的答案编辑器
    if (document.getElementById("answerBody").classList.contains("visible")) {
      (lang === "python" ? pyAnswer : jaAnswer).refresh();
    }
  }, 10);
}

// ── Answer toggle ──
document.getElementById("answerToggle").addEventListener("click", function() {
  this.classList.toggle("expanded");
  document.getElementById("answerBody").classList.toggle("visible");
  setTimeout(function() { pyAnswer.refresh(); jaAnswer.refresh(); }, 50);
});

// ── Approach toggle ──
document.getElementById("approachHeader").addEventListener("click", function(e) {
  if (e.target.closest && e.target.closest("#playbackTrigger")) return;
  document.getElementById("approachArrow").classList.toggle("open");
  document.getElementById("approachBody").classList.toggle("collapsed");
});

// ── Progress (localStorage) ──
// 使用共享模块: shared/progress.js


// ── Vertical splitter + editor refresh ──
// 使用共享模块: shared/splitter.js
// algo 专项：拖拽后 refresh CodeMirror
document.addEventListener("mouseup", function() {
  if (typeof pyEditor !== "undefined") pyEditor.refresh();
  if (typeof javaEditor !== "undefined") javaEditor.refresh();
});

// ── Initial refresh ──
setTimeout(function() { pyEditor.refresh(); }, 50);

// ═══════════════════════════════════════════════════════
//  Walkthrough Player
// ═══════════════════════════════════════════════════════
var playerState = { current: 0, playing: false, timer: null, speed: 800 };

function openPlayback() {
  if (!WALKTHROUGH_DATA || !WALKTHROUGH_DATA.steps || !WALKTHROUGH_DATA.steps.length) {
    alert("⚠️ 该题目暂不支持执行过程回放。\n\n后续批量生成题目时会逐步覆盖更多题型。");
    return;
  }
  document.getElementById("playbackModal").classList.add("open");
  document.body.style.overflow = "hidden";
  playerState.current = 0;
  renderCodePanel();
  renderPlayerStep();
}

function closePlayback() {
  document.getElementById("playbackModal").classList.remove("open");
  document.body.style.overflow = "";
}

var walkCM = null;
function escHtml(s) { return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderCodePanel() {
  var isJava = activeLang === "java";
  var code = isJava ? WALKTHROUGH_DATA.code_java : WALKTHROUGH_DATA.code_python;
  var mode = isJava ? "text/x-java" : "python";
  var ta = document.getElementById("walkthroughCodeTA");
  ta.value = code;
  if (walkCM) {
    walkCM.setOption("mode", mode);
    walkCM.setValue(code);
    walkCM.refresh();
  } else {
    walkCM = CodeMirror.fromTextArea(ta, {
      mode: mode, theme: "dracula", lineNumbers: true,
      readOnly: true, indentUnit: 4, lineWrapping: false,
    });
  }
  // 如果当前步骤超出代码行数，重置到 0
  var codeLines = code.split("\n").length;
  var step = WALKTHROUGH_DATA.steps[playerState.current];
  if (step && step.line >= codeLines) {
    playerState.current = 0;
    renderPlayerStep();
  }
}

function renderPlayerStep() {
  var d = WALKTHROUGH_DATA;
  var steps = d.steps;
  var idx = playerState.current;
  var step = steps[idx];
  if (!step || !walkCM) return;

  // ── Highlight code line ──
  // Clear all highlights
  for (var i = 0; i < walkCM.lineCount(); i++) {
    walkCM.removeLineClass(i, "background", "cm-active");
    walkCM.removeLineClass(i, "background", "cm-found");
  }
  // 按当前语言选用行号（Java 有独立的 ja_line）
  var line = (activeLang === "java" && step.ja_line != null) ? step.ja_line : (step.line || 0);
  var cls = step.status === "found" ? "cm-found" : "cm-active";
  walkCM.addLineClass(line, "background", cls);
  walkCM.scrollIntoView({line: line, ch: 0}, 50);

  // ── Step dots ──
  var dotsHtml = '<div class="step-indicator">';
  for (var i = 0; i < steps.length; i++) {
    var dc = "step-dot";
    var s = steps[i];
    if (s.status === "found") dc += " found";
    else if (i < idx) dc += " done";
    else if (i === idx) dc += " current";
    dotsHtml += '<span class="' + dc + '" onclick="playerGoTo(' + i + ')"></span>';
  }
  dotsHtml += '</div>';

  // ── 解析 input 信息 ──
  var target = null, numsArr = [], expectedOut = "";
  if (WALKTHROUGH_DATA.example) {
    var tm = WALKTHROUGH_DATA.example.match(/target\s*=\s*(\d+)/);
    if (tm) target = parseInt(tm[1]);
    var nm = WALKTHROUGH_DATA.example.match(/nums\s*=\s*\[([^\]]+)\]/);
    if (nm) numsArr = nm[1].split(",").map(function(s){ return parseInt(s.trim()); });
    var om = WALKTHROUGH_DATA.example.match(/输出[：:]\s*(\[.+?\])/);
    if (om) expectedOut = om[1];
  }

  // ── 预先计算 seenBeforeIdx ──
  var seenBeforeIdx = null;
  if ((step.status === "found" || (step.status === "check" && step.hint.indexOf("不在") === -1)) && step.seen) {
    try {
      var fso = {};
      var fsp = step.seen.replace(/[\{\}]/g,"").split(",");
      for (var fpi = 0; fpi < fsp.length; fpi++) {
        var fkv = fsp[fpi].split(":");
        if (fkv.length === 2) fso[parseInt(fkv[0])] = parseInt(fkv[1]);
      }
      seenBeforeIdx = fso[parseInt(step.comp)];
    } catch(e) {}
  }

  // ── 输入/输出 Banner ──
  var bannerHtml = '<div class="viz-info-banner">';
  bannerHtml += '<div class="viz-info-row"><span class="viz-info-label">nums</span><code>' +
    JSON.stringify(numsArr) + '</code></div>';
  bannerHtml += '<div class="viz-info-row"><span class="viz-info-label">target</span><code>' +
    target + '</code></div>';
  if (expectedOut) {
    bannerHtml += '<div class="viz-info-row"><span class="viz-info-label">输出</span><code style="color:var(--green);font-weight:700">' +
      expectedOut + '</code></div>';
  }
  bannerHtml += '</div>';

  // ── 数组可视化 ──
  var arrHtml = '<div class="viz-section"><div class="viz-section-title">📊 数组扫描</div><div class="viz-array">';
  for (var ai = 0; ai < numsArr.length; ai++) {
    var boxCls = "viz-array-box";
    var showArrow = false;
    if (step.status === "found" || step.status === "complete") {
      // found/complete：两个匹配元素都绿色，其余灰
      if (ai === parseInt(step.idx) || ai === seenBeforeIdx) boxCls += " found";
      else boxCls += " processed";
    } else if (step.status === "skip") {
      // skip：该元素灰色（已被跳过），已处理元素灰，未处理元素白
      if (ai === parseInt(step.idx)) boxCls += " processed";
      else if (ai < parseInt(step.idx)) boxCls += " processed";
    } else if (ai === parseInt(step.idx)) {
      boxCls += " current"; showArrow = true;
    } else if (step.status !== "init" && ai < parseInt(step.idx)) {
      boxCls += " processed";
    }
    arrHtml += '<div class="' + boxCls + '">';
    arrHtml += '<span class="val">' + numsArr[ai] + '</span>';
    arrHtml += '<span class="idx">i=' + ai + '</span>';
    if (showArrow) arrHtml += '<span class="viz-arrow">▼</span>';
    arrHtml += '</div>';
  }
  arrHtml += '</div></div>';

  // ── 哈希表可视化 ──
  var seenObj = {};
  if (step.seen && step.seen !== "{}" && step.seen !== "-") {
    try {
      var pairs = step.seen.replace(/[\{\}]/g,"").split(",");
      for (var pi = 0; pi < pairs.length; pi++) {
        var kv = pairs[pi].split(":");
        if (kv.length === 2) seenObj[parseInt(kv[0])] = parseInt(kv[1]);
      }
    } catch(e) {}
  }
  // 新插入的 key
  var newKey = null;
  if (idx > 0 && step.status === "store") {
    try {
      var prevSeen = steps[idx - 1].seen || "{}";
      var prevObj = {};
      var prevPairs = prevSeen.replace(/[\{\}]/g,"").split(",");
      for (var pj = 0; pj < prevPairs.length; pj++) {
        var pkv = prevPairs[pj].split(":");
        if (pkv.length === 2) prevObj[parseInt(pkv[0])] = parseInt(pkv[1]);
      }
      for (var k in seenObj) {
        if (!(k in prevObj)) { newKey = k; break; }
      }
    } catch(e) {}
  }
  // 命中的 key (found 状态)
  var hitKey = null;
  if (step.status === "found" || (step.status === "check" && !step.hint.match(/不/))) {
    hitKey = step.comp;
  }
  var hashHtml = '<div class="viz-section"><div class="viz-section-title">🗂️ 哈希表 seen</div><div class="viz-hashmap">';
  var keys = Object.keys(seenObj);
  if (keys.length === 0) {
    hashHtml += '<span class="viz-hashmap-empty">（空）</span>';
  } else {
    for (var ki = 0; ki < keys.length; ki++) {
      var k = keys[ki];
      var v = seenObj[k];
      var hashBoxCls = "viz-hash-box";
      if (parseInt(k) === parseInt(newKey)) hashBoxCls += " new";
      if (hitKey !== null && parseInt(k) === parseInt(hitKey)) hashBoxCls += " hit";
      hashHtml += '<div class="' + hashBoxCls + '">';
      hashHtml += '<span class="key">' + k + '</span>';
      hashHtml += '<span class="arrow">→</span>';
      hashHtml += '<span class="val">' + v + '</span>';
      hashHtml += '</div>';
    }
  }
  hashHtml += '</div></div>';

  // ── 计算/结果面板 ──
  var panelHtml = '<div class="viz-compute">';
  panelHtml += '<div style="font-size:0.7rem;color:var(--text-muted);margin-bottom:4px">步骤 ' + (idx + 1) + ' / ' + steps.length + '</div>';
  if (step.status === "init") {
    panelHtml += '<div>' + step.hint + '</div>';
  } else if (step.status === "loop") {
    panelHtml += '<div>🔄 ' + step.hint + '</div>';
  } else if (step.status === "compute") {
    panelHtml += '<div>🧮 计算补数</div>';
  } else if (step.status === "check") {
    if (step.hint.indexOf("不在") !== -1) {
      panelHtml += '<div>🔍 查找 seen 表...</div><div class="result-miss">→ 未命中，将存入</div>';
    } else {
      panelHtml += '<div>🔍 查找 seen 表...</div>';
    }
  } else if (step.status === "store") {
    panelHtml += '<div>📥 ' + step.hint + '</div>';
  } else if (step.status === "found") {
    panelHtml += '<div class="result-found" style="font-size:1.1rem;">✅ 命中！答案为 <b>[' + seenBeforeIdx + ', ' + step.idx + ']</b></div>';
    panelHtml += '<div style="font-size:0.75rem;color:var(--text-muted);margin-top:4px">验证：nums[' + seenBeforeIdx + ']+nums[' + step.idx + '] = ' + numsArr[seenBeforeIdx] + '+' + numsArr[step.idx] + ' = ' + target + ' ✅</div>';
  } else if (step.status === "skip") {
    panelHtml += '<div style="color:var(--text-muted);font-style:italic">⏭ ' + step.hint + '</div>';
  } else if (step.status === "complete") {
    panelHtml += '<div class="result-found" style="font-size:1.1rem;">' + step.hint + '</div>';
  }
  panelHtml += '</div>';

  // ── 补数等式卡片 (仅 compute/check/store 显示) ──
  var eqHtml = "";
  if (step.status !== "init" && step.status !== "loop" && step.status !== "skip" && step.status !== "complete" && step.comp && step.comp !== "-") {
    eqHtml = '<div class="viz-equation"><div class="eq-row">';
    eqHtml += '<span class="eq-target">' + target + '</span>';
    eqHtml += '<span class="eq-operator">−</span>';
    eqHtml += '<span class="eq-current">' + step.num + '</span>';
    eqHtml += '<span class="eq-operator">=</span>';
    eqHtml += '<span class="eq-result">complement = ' + step.comp + '</span>';
    eqHtml += '</div></div>';
  }

  // ── 查找连线指示 (仅 check/found 显示) ──
  var lookupHtml = "";
  if (step.status === "check" || step.status === "found") {
    var isHit = step.hint.indexOf("不在") === -1 || step.status === "found";
    var lookupCls = isHit ? "hit" : "miss";
    var lookupText = isHit ? "✅ 在 seen 中找到 " + step.comp + " → 索引 " + seenBeforeIdx : "✗ " + step.comp + " 不在 seen 中";
    lookupHtml = '<div class="viz-lookup">';
    lookupHtml += '<span class="lookup-icon">🔎</span>';
    lookupHtml += '<span class="lookup-dest ' + lookupCls + '">' + lookupText + '</span>';
    lookupHtml += '</div>';
  }

  document.getElementById("modalVizPanel").innerHTML = bannerHtml + panelHtml + dotsHtml + eqHtml + lookupHtml + arrHtml + hashHtml;

  // Counter + buttons
  document.getElementById("stepCounter").textContent = (idx + 1) + "/" + steps.length;
  document.getElementById("btnPrev").disabled = idx === 0;
  document.getElementById("btnNext").disabled = idx >= steps.length - 1;
}

function playerGoTo(idx) {
  playerState.current = Math.max(0, Math.min(WALKTHROUGH_DATA.steps.length - 1, idx));
  renderPlayerStep();
}

function playerNext() {
  if (playerState.current < WALKTHROUGH_DATA.steps.length - 1) {
    playerGoTo(playerState.current + 1);
  }
}

function playerPrev() { playerGoTo(playerState.current - 1); }

function playerReset() { playerGoTo(0); }

// Keyboard shortcuts
document.addEventListener("keydown", function(e) {
  var modal = document.getElementById("playbackModal");
  if (!modal.classList.contains("open")) return;
  if (e.key === "Escape") { closePlayback(); return; }
  if (e.key === "ArrowRight") { e.preventDefault(); playerNext(); return; }
  if (e.key === "ArrowLeft") { e.preventDefault(); playerPrev(); return; }
});

// Close on overlay click
document.getElementById("playbackModal").addEventListener("click", function(e) {
  if (e.target === this) closePlayback();
});
</script>
