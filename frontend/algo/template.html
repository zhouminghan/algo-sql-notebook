<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} - 每日一题</title>
<link rel="stylesheet" href="/lib/codemirror.min.css">
<link rel="stylesheet" href="/lib/dracula.css">
<style>
  :root {
    --bg: #0f0f14; --code-bg: #1e1e2e; --border: #2a2a3a;
    --text: #e0e0e0; --text-muted: #777; --accent: #6c5ce7;
    --green: #00b894; --yellow: #fdcb6e; --red: #e17055;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; display: flex;
  }
  /* ── left panel ── */
  .left-panel {
    padding: 24px; overflow-y: auto; background: #12121a; flex: none;
  }
  .left-panel h2 { font-size: 1.2rem; margin-bottom: 4px; }
  .difficulty-tag {
    display: inline-block; font-size: 0.72rem; padding: 2px 10px;
    border-radius: 4px; margin-bottom: 16px;
  }
  .difficulty-tag.easy{background:#1a3a2a;color:var(--green)}
  .difficulty-tag.medium{background:#3a2a1a;color:var(--yellow)}
  .difficulty-tag.hard{background:#3a1a1a;color:var(--red)}

  .desc-block {
    background: #1a1a28; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px;
    font-size: 0.88rem; line-height: 1.65; white-space: pre-wrap;
  }
  .examples-section{margin-bottom:16px}
  .examples-section h3{font-size:0.78rem;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
  .example-card{
    background:#1a1a28;border:1px solid var(--border);border-radius:8px;
    padding:12px 14px;margin-bottom:8px;
  }
  .example-num{font-size:0.72rem;color:var(--accent);margin-bottom:6px;font-weight:600}
  .example-row{display:flex;gap:8px;margin-bottom:3px;font-size:0.82rem;line-height:1.5}
  .example-row .ex-label{color:var(--text-muted);min-width:30px;font-size:0.72rem;flex-shrink:0}
  .example-row code{color:var(--green);font-family:"SF Mono","Monaco","Menlo",monospace;font-size:0.82rem}
  .example-row .ex-text{color:var(--text-muted)}

  /* walkthrough table */
  .walkthrough-block {
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow-x: auto; margin-bottom: 16px;
  }
  .walkthrough-block h3 {
    font-size: 0.78rem; color: var(--text-muted);
    padding: 10px 14px 0; text-transform: uppercase; letter-spacing: 1px;
  }
  .walk-table {
    width: 100%; border-collapse: collapse; font-size: 0.76rem;
  }
  .walk-table th {
    padding: 6px 8px; background: #1a1a28; color: var(--text-muted);
    font-weight: 500; text-align: left; white-space: nowrap;
    position: sticky; top: 0;
  }
  .walk-table td {
    padding: 6px 8px; border-top: 1px solid var(--border);
    vertical-align: top; line-height: 1.5;
  }
  .walk-table .step-tag {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    background: #2d1f5e; color: var(--accent); font-weight: 600;
    white-space: nowrap;
  }
  .walk-table .hash-state {
    color: var(--yellow); font-size: 0.74rem;
  }
  .walk-table .walk-found td {
    background: #0a2a1a;
  }
  .walk-table .walk-found .step-tag {
    background: var(--green); color: #fff;
  }

  /* approach section */
  .approach-section {
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 12px;
  }
  .approach-header {
    padding: 10px 14px; background: #1a1a28; display: flex;
    justify-content: space-between; align-items: center;
  }
  .approach-header h4 {
    font-size: 0.85rem; color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .approach-header .toggle-arrow {
    transition: transform 0.2s; font-size: 0.7rem; color: var(--text-muted);
  }
  .approach-header .toggle-arrow.open { transform: rotate(90deg); }
  .approach-body {
    display: block; padding: 0; border-top: 1px solid var(--border);
    font-size: 0.82rem; line-height: 1.6;
  }
  .approach-body.collapsed { display: none; }

  .approach-compare {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
  }
  .approach-card {
    padding: 14px; position: relative;
  }
  .approach-card.rejected {
    background: #1a1515; border-right: 1px solid var(--border);
  }
  .approach-card.accepted {
    background: #0a2a1a;
  }
  .approach-card .verdict {
    position: absolute; top: 10px; right: 12px;
    font-size: 1.2rem;
  }
  .approach-card .card-title {
    font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;
    padding-right: 24px;
  }
  .approach-card.rejected .card-title { color: var(--red); }
  .approach-card.accepted .card-title { color: var(--green); }
  .approach-card .card-idea {
    font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px;
  }
  .approach-card .complexity-tag {
    display: inline-block; padding: 2px 10px; border-radius: 4px;
    font-size: 0.72rem; font-weight: 600;
  }
  .approach-card.rejected .complexity-tag {
    background: #3a1a1a; color: var(--red);
  }
  .approach-card.accepted .complexity-tag {
    background: #1a3a2a; color: var(--green);
  }
  .approach-card .flow {
    margin-top: 8px; font-size: 0.76rem; color: var(--text);
    font-family: "SF Mono","Monaco","Menlo",monospace;
    background: rgba(0,0,0,0.2); padding: 6px 10px; border-radius: 4px;
  }

  /* playback trigger button */
  .playback-trigger {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 10px 14px; margin-top: 10px;
    background: linear-gradient(135deg, rgba(108,92,231,0.3), rgba(108,92,231,0.1));
    border: 1px solid rgba(108,92,231,0.4); border-radius: 8px;
    color: #fff; cursor: pointer; font-size: 0.82rem; font-weight: 600;
    transition: all 0.15s;
  }
  .playback-trigger:hover { background: rgba(108,92,231,0.25); border-color: var(--accent); }
  .playback-trigger .pb-icon { font-size: 1.1rem; }

  /* ── modal overlay ── */
  .modal-overlay {
    display: none;
    position: fixed !important;
    top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
    width: 100vw !important; height: 100vh !important;
    background: rgba(0, 0, 0, 0.85);
    z-index: 9999 !important;
    justify-content: center; align-items: center;
  }
  .modal-overlay.open { display: flex !important; }
  .modal-dialog {
    background: linear-gradient(145deg, #1a1a28, #12121a);
    border: 1px solid rgba(108, 92, 231, 0.4);
    border-radius: 16px;
    width: min(95vw, 1150px); height: min(85vh, 680px);
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow:
      0 0 40px rgba(108, 92, 231, 0.25),
      0 20px 60px rgba(0, 0, 0, 0.7),
      inset 0 1px 0 rgba(255, 255, 255, 0.02);
    animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.92) translateY(-10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px;
    background: linear-gradient(180deg, rgba(108,92,231,0.1), transparent);
    border-bottom: 1px solid rgba(108, 92, 231, 0.2);
    flex-shrink: 0;
  }
  .modal-titlebar h3 { font-size: 1rem; letter-spacing: 0.3px; }
  .modal-titlebar .close-modal {
    width: 32px; height: 32px; border-radius: 8px; border: none;
    background: rgba(255,255,255,0.05); color: var(--text-muted);
    font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .modal-titlebar .close-modal:hover { background: rgba(255,0,0,0.15); color: var(--red); }

  .modal-body { flex: 1; display: flex; overflow: hidden; min-height: 0; }

  .modal-controls {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 12px 20px;
    border-top: 1px solid rgba(108, 92, 231, 0.2);
    background: rgba(108, 92, 231, 0.04);
    flex-shrink: 0;
  }
  .modal-controls button {
    padding: 7px 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
    background: rgba(255,255,255,0.03); color: var(--text); font-size: 0.82rem;
    cursor: pointer; transition: all 0.15s;
  }
  .modal-controls button:hover { border-color: var(--accent); background: rgba(108,92,231,0.1); }
  .modal-controls button:disabled { opacity: 0.2; cursor: default; }
  .modal-controls .btn-play {
    background: var(--accent); border-color: var(--accent); color: #fff;
    min-width: 90px; justify-content: center; font-weight: 600;
  }
  .modal-controls .btn-play:hover { filter: brightness(1.15); }
  .modal-controls .speed-label { font-size: 0.68rem; color: var(--text-muted); margin: 0 2px; }
  .modal-controls input[type=range] { width: 80px; accent-color: var(--accent); }

  .modal-code-panel {
    width: 45%; overflow-y: auto; border-right: 1px solid rgba(108,92,231,0.15);
    background: rgba(0,0,0,0.2); padding: 0; flex-shrink: 0;
  }
  .modal-viz-panel {
    flex: 1; padding: 18px; overflow-y: auto; display: flex;
    flex-direction: column; gap: 12px; background: rgba(0,0,0,0.1);
  }
  .modal-viz-panel .step-indicator { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
  .modal-viz-panel .step-dot {
    width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.08);
    cursor: pointer; transition: all 0.2s;
  }
  .modal-viz-panel .step-dot.done { background: var(--accent); }
  .modal-viz-panel .step-dot.current { background: #fff; transform: scale(1.4); box-shadow: 0 0 8px rgba(255,255,255,0.3); }
  .modal-viz-panel .step-dot.found { background: var(--green); }

  .modal-hint-box {
    background: rgba(108,92,231,0.06); border: 1px solid rgba(108,92,231,0.15);
    border-radius: 10px; padding: 14px 16px; font-size: 0.85rem; line-height: 1.6;
  }
  .modal-hint-box .hint-step-num { font-size: 0.7rem; color: var(--accent); margin-bottom: 4px; }
  .modal-hint-box .hint-text { font-size: 0.88rem; color: var(--text); }
  .modal-hint-box .hint-text.found-status { color: var(--green); font-weight: 700; }

  .modal-state-table {
    border: 1px solid rgba(108,92,231,0.1); border-radius: 10px; overflow: hidden; font-size: 0.8rem;
  }
  .modal-state-table table { width: 100%; border-collapse: collapse; }
  .modal-state-table th {
    padding: 7px 12px; background: rgba(108,92,231,0.1);
    color: var(--text-muted); font-weight: 500; text-align: left;
  }
  .modal-state-table td {
    padding: 6px 12px; border-top: 1px solid rgba(255,255,255,0.04);
    transition: background 0.2s;
  }
  .modal-state-table .step-current { background: rgba(108, 92, 231, 0.12); }

  .modal-code-panel pre {
    padding: 14px 0; margin: 0; counter-reset: line;
    font-family: "SF Mono","Monaco","Menlo",monospace; font-size: 13px;
    line-height: 1.65; color: var(--text); min-height: 100%; white-space: pre;
  }
  .modal-code-panel .code-line {
    display: block; padding: 0 16px 0 56px; position: relative; min-height: 21.45px;
  }
  .modal-code-panel .code-line::before {
    content: counter(line); counter-increment: line;
    position: absolute; left: 8px; width: 38px; text-align: right;
    color: var(--text-muted); font-size: 0.72rem; padding-right: 6px;
    user-select: none;
  }
  .modal-code-panel .code-line.active {
    background: rgba(108, 92, 231, 0.25); border-left: 3px solid var(--accent);
  }
  .modal-code-panel .code-line.found {
    background: rgba(0, 184, 148, 0.2); border-left: 3px solid var(--green);
  }

  /* ── right panel ── */
  .right-panel {
    flex: 1; min-width: 300px; display: flex; flex-direction: column;
    overflow-y: auto; background: var(--bg);
  }
  .v-splitter {
    width: 6px; cursor: col-resize; background: #1a1a28;
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .v-splitter:hover { background: #2a2a40; }
  .v-splitter:active { background: var(--accent); }
  .v-splitter .grip-v {
    width: 2px; height: 28px; background: var(--text-muted); border-radius: 1px;
  }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: #12121a; position: sticky; top: 0; z-index: 10;
  }
  .topbar .back-btn{ padding:5px 10px;border:1px solid var(--border);border-radius:6px; color:var(--text-muted);text-decoration:none;font-size:0.8rem; }
  .topbar .back-btn:hover{border-color:var(--accent);color:var(--text)}
  .lang-tabs{display:flex;gap:4px}
  .lang-tab{ padding:4px 12px;border:1px solid var(--border);border-radius:5px; background:transparent;color:var(--text-muted);font-size:0.78rem;cursor:pointer; }
  .lang-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .progress-toggle{display:flex;gap:5px;margin-left:auto}
  .progress-toggle button{ padding:4px 10px;border:1px solid var(--border);border-radius:5px; background:transparent;color:var(--text-muted);font-size:0.72rem;cursor:pointer; }
  .progress-toggle button.done{border-color:var(--green);color:var(--green)}
  .progress-toggle button.done:hover{background:var(--green);color:#fff}
  .progress-toggle button.review{border-color:var(--yellow);color:var(--yellow)}
  .progress-toggle button.review:hover{background:var(--yellow);color:#111}

  .code-body{flex:1;padding:16px 20px;overflow-y:auto}

  .CodeMirror {
    height: auto !important; min-height: 260px;
    font-family: "SF Mono","Monaco","Menlo",monospace; font-size: 14px; border-radius: 8px;
  }
  .editor-hint{ padding:6px 14px;font-size:0.72rem;color:var(--text-muted);display:flex;justify-content:space-between; }

  .answer-section{ border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin:14px 0; }
  .answer-toggle{ width:100%;padding:10px 16px;background:#1a1a28;border:none;color:var(--text);text-align:left;cursor:pointer;font-size:0.85rem;display:flex;justify-content:space-between; }
  .answer-toggle:hover{background:#222238}
  .answer-toggle .arrow-a{transition:transform 0.2s;font-size:0.7rem}
  .answer-toggle.expanded .arrow-a{transform:rotate(90deg)}
  .answer-body{display:none;border-top:1px solid var(--border);}
  .answer-body.visible{display:block}

  .section-box{ background:#1a1a28;border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px; }
  .section-box h4{font-size:0.8rem;color:var(--yellow);margin-bottom:4px}
  .section-box ul{padding-left:16px;font-size:0.8rem;color:var(--text-muted)}
  .section-box li{margin-bottom:2px}

  @media(max-width:768px){ body{flex-direction:column} .left-panel,.right-panel{width:100%!important} }
</style>
</head>
<body>

<div class="left-panel">
  <h2>{{TITLE}}</h2>
  <span class="difficulty-tag {{DIFFICULTY_CLASS}}">{{DIFFICULTY}}</span>
  <div class="desc-block">{{DESCRIPTION}}</div>
  {{EXAMPLES}}

  {{WALKTHROUGH}}

  <div class="approach-section" id="approachSection">
    <div class="approach-header" id="approachHeader">
      <h4>🧠 解题思路对比</h4>
      <span class="toggle-arrow" id="approachArrow">▶</span>
    </div>
    <div class="approach-body" id="approachBody">
      <div class="approach-compare">
        {{APPROACH_CARDS}}
      </div>
      <button class="playback-trigger" id="playbackTrigger" onclick="openPlayback()" style="margin-top:10px;width:100%">
        <span class="pb-icon">🎮</span> 步骤演示（逐步查看每一步的代码执行与数据变化）
      </button>
    </div>
  </div>
</div>

<div class="v-splitter" id="vSplitter"><div class="grip-v"></div></div>

<div class="right-panel">
  <div class="topbar">
    <a href="/" class="back-btn">← 返回</a>
    <div class="lang-tabs">
      <button class="lang-tab active" data-lang="python" onclick="switchLang('python')">Python</button>
      <button class="lang-tab" data-lang="java" onclick="switchLang('java')">Java</button>
    </div>
    <div class="progress-toggle">
      <button class="done" onclick="markStatus('done')">✓ 掌握</button>
      <button class="review" onclick="markStatus('review')">⚠ 复习</button>
    </div>
  </div>

  <div class="code-body">
    <div id="editor-python">
      <textarea id="codePython">{{CODE_PYTHON}}</textarea>
      <div class="editor-hint"><span>在此编写 Python 代码</span><span>自动保存到本地</span></div>
    </div>
    <div id="editor-java" style="display:none">
      <textarea id="codeJava">{{CODE_JAVA}}</textarea>
      <div class="editor-hint"><span>在此编写 Java 代码</span><span>自动保存到本地</span></div>
    </div>

    <div class="answer-section">
      <button class="answer-toggle" id="answerToggle">
        <span>📖 查看题解</span><span class="arrow-a">▶</span>
      </button>
      <div class="answer-body" id="answerBody">
        <div id="answer-python-view" style="display:block">
          <textarea id="answerCodePython" readonly>{{ANSWER_PYTHON}}</textarea>
        </div>
        <div id="answer-java-view" style="display:none">
          <textarea id="answerCodeJava" readonly>{{ANSWER_JAVA}}</textarea>
        </div>
      </div>
    </div>

    <div class="section-box">
      <h4>🧠 关键点</h4>
      <ul>{{KEYPOINTS}}</ul>
    </div>
    <div class="section-box" style="background:#1a1515;">
      <h4 style="color:var(--red)">⚠️ 易错点</h4>
      <ul>{{GOTCHAS}}</ul>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════ -->
<!--  Walkthrough 步骤回放弹窗                           -->
<!-- ═══════════════════════════════════════════════════ -->
<div class="modal-overlay" id="playbackModal">
  <div class="modal-dialog">
    <div class="modal-titlebar">
      <h3>🎮 执行过程回放 · {{TITLE}}</h3>
      <button class="close-modal" onclick="closePlayback()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="modal-code-panel" id="modalCodePanel"></div>
      <div class="modal-viz-panel" id="modalVizPanel"></div>
    </div>
    <div class="modal-controls">
      <button onclick="playerPrev()" id="btnPrev">⏮ 上一步</button>
      <button onclick="playerReset()" id="btnReset">↻ 重置</button>
      <button class="btn-play" onclick="playerTogglePlay()" id="btnPlay">▶ 播放</button>
      <button onclick="playerNext()" id="btnNext">下一步 ⏭</button>
      <span class="speed-label">慢</span>
      <input type="range" min="300" max="2000" value="800" step="100" id="speedSlider" oninput="playerSetSpeed(this.value)">
      <span class="speed-label">快</span>
      <span style="font-size:0.72rem;color:var(--text-muted);margin-left:8px" id="stepCounter">0/0</span>
    </div>
  </div>
</div>

<!-- Walkthrough data (injected by render.py) -->
<script>
var WALKTHROUGH_DATA = null;
try {
  var _rawData = {{WALKTHROUGH_STEPS_JSON}};
  if (_rawData && typeof _rawData === "object") WALKTHROUGH_DATA = _rawData;
} catch(e) { WALKTHROUGH_DATA = null; }
// Always show the button — openPlayback handles missing data gracefully
console.log("[algo-practice] walkthrough player loaded, steps:", WALKTHROUGH_DATA ? WALKTHROUGH_DATA.steps.length : 0, "| page build: {{BUILD_TIME}}");
</script>

<script src="/lib/codemirror.min.js"></script>
<script src="/lib/mode/python.min.js"></script>
<script src="/lib/mode/clike.min.js"></script>
<script>
var PROBLEM_ID = "{{PROBLEM_ID}}";
var PROBLEM_TYPE = "algo";
var STORAGE_KEY_PY = "algo_code_" + PROBLEM_ID + "_python";
var STORAGE_KEY_JA = "algo_code_" + PROBLEM_ID + "_java";

// ── Create CodeMirror editors ──
function makeEditor(id, mode) {
  var ta = document.getElementById(id);
  var saved = null;
  if (id === "codePython") {
    try { saved = localStorage.getItem(STORAGE_KEY_PY); } catch(e) {}
  } else if (id === "codeJava") {
    try { saved = localStorage.getItem(STORAGE_KEY_JA); } catch(e) {}
  }
  if (saved) ta.value = saved;
  return CodeMirror.fromTextArea(ta, {
    mode: mode, theme: "dracula", lineNumbers: true,
    matchBrackets: true, autoCloseBrackets: true,
    indentUnit: 4, tabSize: 4, indentWithTabs: false,
    smartIndent: true, electricChars: true, lineWrapping: false,
  });
}

var pyEditor = makeEditor("codePython", "python");
var jaEditor = makeEditor("codeJava", "text/x-java");
var pyAnswer = makeEditor("answerCodePython", "python");
pyAnswer.setOption("readOnly", true);
var jaAnswer = makeEditor("answerCodeJava", "text/x-java");
jaAnswer.setOption("readOnly", true);

// ── Auto-save ──
(function() {
  var ac = hasCM ? "change" : "input";
  pyEditor.on(ac, function() {
    try { localStorage.setItem(STORAGE_KEY_PY, pyEditor.getValue()); } catch(e) {}
  });
  jaEditor.on(ac, function() {
    try { localStorage.setItem(STORAGE_KEY_JA, jaEditor.getValue()); } catch(e) {}
  });
})();

// ── Tab switch ──
function switchLang(lang) {
  document.querySelectorAll(".lang-tab").forEach(function(t) { t.classList.remove("active"); });
  document.querySelector('.lang-tab[data-lang="' + lang + '"]').classList.add("active");
  document.getElementById("editor-python").style.display = lang === "python" ? "block" : "none";
  document.getElementById("editor-java").style.display = lang === "java" ? "block" : "none";
  document.getElementById("answer-python-view").style.display = lang === "python" ? "block" : "none";
  document.getElementById("answer-java-view").style.display = lang === "java" ? "block" : "none";
  setTimeout(function() {
    (lang === "python" ? pyEditor : jaEditor).refresh();
    // 如果答案面板开着，刷新新 Tab 的答案编辑器
    if (document.getElementById("answerBody").classList.contains("visible")) {
      (lang === "python" ? pyAnswer : jaAnswer).refresh();
    }
  }, 10);
}

// ── Answer toggle ──
document.getElementById("answerToggle").addEventListener("click", function() {
  this.classList.toggle("expanded");
  document.getElementById("answerBody").classList.toggle("visible");
  setTimeout(function() { pyAnswer.refresh(); jaAnswer.refresh(); }, 50);
});

// ── Approach toggle ──
document.getElementById("approachHeader").addEventListener("click", function(e) {
  if (e.target.closest && e.target.closest("#playbackTrigger")) return;
  document.getElementById("approachArrow").classList.toggle("open");
  document.getElementById("approachBody").classList.toggle("collapsed");
});

// ── Progress ──
async function markStatus(status) {
  var resp = await fetch("/api/progress/" + PROBLEM_TYPE + "/" + PROBLEM_ID + "?status=" + status, { method: "POST" });
  if (resp.ok) {
    document.querySelectorAll(".progress-toggle button").forEach(function(b) {
      if (b.classList.contains(status)) {
        b.style.background = "var(--green)"; b.style.color = "#fff";
      } else {
        b.style.background = "transparent"; b.style.color = "";
      }
    });
  }
}

// ── Vertical splitter ──
var vs = document.getElementById("vSplitter");
var lp = document.querySelector(".left-panel");
var isDraggingV = false;
function setVSplit(px) {
  var maxW = document.body.clientWidth - vs.offsetWidth - 360;
  px = Math.max(280, Math.min(maxW, px));
  lp.style.width = px + "px";
}
setTimeout(function() { setVSplit(document.body.clientWidth * 0.4); }, 100);
vs.addEventListener("mousedown", function(e) {
  isDraggingV = true; document.body.style.cursor = "col-resize";
  document.body.style.userSelect = "none"; e.preventDefault();
});
document.addEventListener("mousemove", function(e) { if (isDraggingV) setVSplit(e.clientX); });
document.addEventListener("mouseup", function() {
  if (isDraggingV) { isDraggingV = false; document.body.style.cursor = ""; document.body.style.userSelect = ""; }
});

// ── Initial refresh ──
setTimeout(function() { pyEditor.refresh(); }, 50);

// ═══════════════════════════════════════════════════════
//  Walkthrough Player
// ═══════════════════════════════════════════════════════
var playerState = { current: 0, playing: false, timer: null, speed: 800 };

function openPlayback() {
  if (!WALKTHROUGH_DATA || !WALKTHROUGH_DATA.steps || !WALKTHROUGH_DATA.steps.length) {
    alert("⚠️ 该题目暂不支持执行过程回放。\n\n后续批量生成题目时会逐步覆盖更多题型。");
    return;
  }
  document.getElementById("playbackModal").classList.add("open");
  document.body.style.overflow = "hidden";
  playerState.current = 0;
  renderCodePanel();
  renderPlayerStep();
}

function closePlayback() {
  playerPause();
  document.getElementById("playbackModal").classList.remove("open");
  document.body.style.overflow = "";
}

function renderCodePanel() {
  var d = WALKTHROUGH_DATA;
  var code = d.code_python;
  var lines = code.split("\n");
  var html = "<pre>";
  for (var i = 0; i < lines.length; i++) {
    var cls = "code-line";
    html += '<span class="' + cls + '" data-line="' + i + '">' + escHtml(lines[i]) + "</span>\n";
  }
  html += "</pre>";
  document.getElementById("modalCodePanel").innerHTML = html;
}

function escHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderPlayerStep() {
  var d = WALKTHROUGH_DATA;
  var steps = d.steps;
  var idx = playerState.current;
  var step = steps[idx];
  if (!step) return;

  // ── Highlight code line ──
  var codeLines = document.querySelectorAll("#modalCodePanel .code-line");
  codeLines.forEach(function(el) {
    el.classList.remove("active", "found");
    if (parseInt(el.dataset.line) === (step.line || -1)) {
      el.classList.add(step.status === "found" ? "found" : "active");
    }
  });
  // Scroll highlighted line into view
  var activeLine = document.querySelector("#modalCodePanel .code-line.active, #modalCodePanel .code-line.found");
  if (activeLine) activeLine.scrollIntoView({ block: "center", behavior: "smooth" });

  // ── Step dots ──
  var dotsHtml = '<div class="step-indicator">';
  for (var i = 0; i < steps.length; i++) {
    var cls = "step-dot";
    var s = steps[i];
    if (s.status === "found") cls += " found";
    else if (i < idx) cls += " done";
    else if (i === idx) cls += " current";
    dotsHtml += '<span class="' + cls + '" onclick="playerGoTo(' + i + ')" title="步骤 ' + (i+1) + '"></span>';
  }
  dotsHtml += '</div>';

  // ── Hint box ──
  var hintStatus = step.status === "found" ? " found-status" : "";
  var hintHtml = '<div class="modal-hint-box">';
  hintHtml += '<div class="hint-step-num">步骤 ' + (idx + 1) + ' / ' + steps.length + '</div>';
  hintHtml += '<div class="hint-text' + hintStatus + '">' + step.hint + '</div>';
  hintHtml += '</div>';

  // ── State table ──
  var stateCols = [];
  if (step.idx !== undefined) stateCols.push(["索引 i", step.idx]);
  if (step.num !== undefined) stateCols.push(["当前值 nums[i]", step.num]);
  if (step.comp !== undefined) stateCols.push(["补数 target-nums[i]", step.comp]);
  if (step.seen !== undefined) stateCols.push(["seen 哈希表", step.seen]);

  // ── Full step history table ──
  var tableHtml = '<div class="modal-state-table"><table>';
  tableHtml += '<thead><tr><th>#</th>';
  var headers = [];
  for (var h = 0; h < stateCols.length; h++) headers.push(stateCols[h][0]);
  for (var hh = 0; hh < headers.length; hh++) tableHtml += '<th>' + headers[hh] + '</th>';
  tableHtml += '</tr></thead><tbody>';

  // Show all steps up to current
  for (var j = 0; j <= idx; j++) {
    var sj = steps[j];
    var rowCls = j === idx ? " step-current" : "";
    tableHtml += '<tr class="' + rowCls + '"><td>' + (j + 1) + '</td>';
    tableHtml += '<td>' + (sj.idx !== undefined ? sj.idx : "-") + '</td>';
    tableHtml += '<td>' + (sj.num !== undefined ? sj.num : "-") + '</td>';
    tableHtml += '<td>' + (sj.comp !== undefined ? sj.comp : "-") + '</td>';
    tableHtml += '<td><code style="color:var(--yellow);font-size:0.78rem">' + (sj.seen || "-") + '</code></td>';
    tableHtml += '</tr>';
  }
  tableHtml += '</tbody></table></div>';

  document.getElementById("modalVizPanel").innerHTML = dotsHtml + hintHtml + tableHtml;

  // ── Update counter + buttons ──
  document.getElementById("stepCounter").textContent = (idx + 1) + "/" + steps.length;
  document.getElementById("btnPrev").disabled = idx === 0;
  document.getElementById("btnNext").disabled = idx >= steps.length - 1;
}

function playerGoTo(idx) {
  playerPause();
  playerState.current = Math.max(0, Math.min(WALKTHROUGH_DATA.steps.length - 1, idx));
  renderPlayerStep();
}

function playerNext() {
  if (playerState.current < WALKTHROUGH_DATA.steps.length - 1) {
    playerGoTo(playerState.current + 1);
  } else {
    playerPause();
  }
}

function playerPrev() { playerGoTo(playerState.current - 1); }

function playerReset() { playerGoTo(0); }

function playerTogglePlay() {
  if (playerState.playing) {
    playerPause();
  } else {
    playerPlay();
  }
}

function playerPlay() {
  if (playerState.current >= WALKTHROUGH_DATA.steps.length - 1) {
    playerState.current = 0;
    renderPlayerStep();
  }
  playerState.playing = true;
  document.getElementById("btnPlay").innerHTML = "⏸ 暂停";
  playerAdvance();
}

function playerPause() {
  playerState.playing = false;
  document.getElementById("btnPlay").innerHTML = "▶ 播放";
  if (playerState.timer) { clearTimeout(playerState.timer); playerState.timer = null; }
}

function playerAdvance() {
  if (!playerState.playing) return;
  if (playerState.current >= WALKTHROUGH_DATA.steps.length - 1) {
    playerPause();
    return;
  }
  playerGoTo(playerState.current + 1);
  if (playerState.playing) {
    playerState.timer = setTimeout(playerAdvance, playerState.speed);
  }
}

function playerSetSpeed(val) {
  playerState.speed = parseInt(val);
  if (playerState.playing) {
    playerPause();
    playerPlay();
  }
}

// Keyboard shortcuts
document.addEventListener("keydown", function(e) {
  var modal = document.getElementById("playbackModal");
  if (!modal.classList.contains("open")) return;
  if (e.key === "Escape") { closePlayback(); return; }
  if (e.key === "ArrowRight") { e.preventDefault(); playerNext(); return; }
  if (e.key === "ArrowLeft") { e.preventDefault(); playerPrev(); return; }
  if (e.key === " ") { e.preventDefault(); playerTogglePlay(); return; }
});

// Close on overlay click
document.getElementById("playbackModal").addEventListener("click", function(e) {
  if (e.target === this) closePlayback();
});
</script>
