<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} - 每日一题</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<style>
  :root {
    --bg: #0f0f14; --code-bg: #1e1e2e; --border: #2a2a3a;
    --text: #e0e0e0; --text-muted: #777; --accent: #6c5ce7;
    --green: #00b894; --yellow: #fdcb6e; --red: #e17055;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; display: flex;
  }
  /* ── left panel ── */
  .left-panel {
    width: 40%; padding: 28px; border-right: 1px solid var(--border);
    overflow-y: auto; background: #12121a;
  }
  .left-panel h2 { font-size: 1.2rem; margin-bottom: 6px; }
  .difficulty-tag {
    display: inline-block; font-size: 0.72rem; padding: 2px 10px;
    border-radius: 4px; margin-bottom: 18px;
  }
  .difficulty-tag.easy{background:#1a3a2a;color:var(--green)}
  .difficulty-tag.medium{background:#3a2a1a;color:var(--yellow)}
  .difficulty-tag.hard{background:#3a1a1a;color:var(--red)}

  .desc-block {
    background: #1a1a28; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 20px;
    font-size: 0.88rem; line-height: 1.65; white-space: pre-wrap;
  }
  .examples-section{margin-bottom:20px}
  .examples-section h3{font-size:0.82rem;color:var(--text-muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
  .example-card{
    background:#1a1a28;border:1px solid var(--border);border-radius:8px;
    padding:14px 16px;margin-bottom:10px;
  }
  .example-num{font-size:0.75rem;color:var(--accent);margin-bottom:8px;font-weight:600}
  .example-row{display:flex;gap:10px;margin-bottom:4px;font-size:0.84rem;line-height:1.5}
  .example-row .ex-label{color:var(--text-muted);min-width:32px;font-size:0.75rem;flex-shrink:0}
  .example-row code{color:var(--green);font-family:"SF Mono","Monaco","Menlo",monospace;font-size:0.84rem}
  .example-row .ex-text{color:var(--text-muted)}

  /* ── right panel ── */
  .right-panel {
    width: 60%; display: flex; flex-direction: column; overflow-y: auto; background: var(--bg);
  }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: #12121a; position: sticky; top: 0; z-index: 10;
  }
  .topbar .back-btn{
    padding:5px 10px;border:1px solid var(--border);border-radius:6px;
    color:var(--text-muted);text-decoration:none;font-size:0.8rem;
  }
  .topbar .back-btn:hover{border-color:var(--accent);color:var(--text)}
  .lang-tabs{display:flex;gap:4px}
  .lang-tab{
    padding:4px 12px;border:1px solid var(--border);border-radius:5px;
    background:transparent;color:var(--text-muted);font-size:0.78rem;cursor:pointer;
  }
  .lang-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .progress-toggle{display:flex;gap:5px;margin-left:auto}
  .progress-toggle button{
    padding:4px 10px;border:1px solid var(--border);border-radius:5px;
    background:transparent;color:var(--text-muted);font-size:0.72rem;cursor:pointer;
  }
  .progress-toggle button.done{border-color:var(--green);color:var(--green)}
  .progress-toggle button.done:hover{background:var(--green);color:#fff}
  .progress-toggle button.review{border-color:var(--yellow);color:var(--yellow)}
  .progress-toggle button.review:hover{background:var(--yellow);color:#111}

  .code-body{flex:1;padding:16px 20px;overflow-y:auto}

  /* CodeMirror overrides */
  .CodeMirror {
    height: auto !important; min-height: 260px;
    font-family: "SF Mono","Monaco","Menlo",monospace;
    font-size: 14px; border-radius: 8px;
  }
  .editor-hint{
    padding:6px 14px;font-size:0.72rem;color:var(--text-muted);
    display:flex;justify-content:space-between;
  }

  .answer-section{
    border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;margin:14px 0;
  }
  .answer-toggle{
    width:100%;padding:10px 16px;background:#1a1a28;border:none;
    color:var(--text);text-align:left;cursor:pointer;font-size:0.85rem;
    display:flex;justify-content:space-between;
  }
  .answer-toggle:hover{background:#222238}
  .answer-toggle .arrow-c{transition:transform 0.2s;font-size:0.7rem}
  .answer-toggle.expanded .arrow-c{transform:rotate(90deg)}
  .answer-body{display:none;border-top:1px solid var(--border)}
  .answer-body.visible{display:block}

  .section-box{
    background:#1a1a28;border:1px solid var(--border);
    border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;
  }
  .section-box h4{font-size:0.8rem;color:var(--yellow);margin-bottom:6px}
  .section-box ul{padding-left:18px;font-size:0.82rem;color:var(--text-muted)}
  .section-box li{margin-bottom:3px}

  @media(max-width:768px){
    body{flex-direction:column}
    .left-panel,.right-panel{width:100%}
    .left-panel{border-right:none;border-bottom:1px solid var(--border)}
  }
</style>
</head>
<body>

<div class="left-panel">
  <h2>{{TITLE}}</h2>
  <span class="difficulty-tag {{DIFFICULTY_CLASS}}">{{DIFFICULTY}}</span>
  <div class="desc-block">{{DESCRIPTION}}</div>
  {{EXAMPLES}}
</div>

<div class="right-panel">
  <div class="topbar">
    <a href="/" class="back-btn">← 返回</a>
    <div class="lang-tabs">
      <button class="lang-tab active" data-lang="python" onclick="switchLang('python')">Python</button>
      <button class="lang-tab" data-lang="java" onclick="switchLang('java')">Java</button>
    </div>
    <div class="progress-toggle">
      <button class="done" onclick="markStatus('done')">✓ 掌握</button>
      <button class="review" onclick="markStatus('review')">⚠ 复习</button>
    </div>
  </div>

  <div class="code-body">
    <!-- Template code stored to avoid JS escaping -->
    <script type="text/plain" id="tmpl-python">{{CODE_PYTHON}}</script>
    <script type="text/plain" id="tmpl-java">{{CODE_JAVA}}</script>
    <!-- Answer code -->
    <script type="text/plain" id="answer-python">{{ANSWER_PYTHON}}</script>
    <script type="text/plain" id="answer-java">{{ANSWER_JAVA}}</script>

    <div id="editor-python">
      <textarea id="codePython"></textarea>
      <div class="editor-hint"><span>在此编写 Python 代码</span><span>自动保存到本地</span></div>
    </div>
    <div id="editor-java" style="display:none">
      <textarea id="codeJava"></textarea>
      <div class="editor-hint"><span>在此编写 Java 代码</span><span>自动保存到本地</span></div>
    </div>

    <div class="answer-section">
      <button class="answer-toggle" id="answerToggle">
        <span>📖 查看题解</span>
        <span class="arrow-c">▶</span>
      </button>
      <div class="answer-body" id="answerBody">
        <div id="answer-python-view" style="display:block"><textarea id="answerCodePython" readonly></textarea></div>
        <div id="answer-java-view" style="display:none"><textarea id="answerCodeJava" readonly></textarea></div>
      </div>
    </div>

    <div class="section-box">
      <h4>🧠 关键点</h4>
      <ul>{{KEYPOINTS}}</ul>
    </div>
    <div class="section-box" style="background:#1a1515;">
      <h4 style="color:var(--red)">⚠️ 易错点</h4>
      <ul>{{GOTCHAS}}</ul>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script>
var PROBLEM_ID = "{{PROBLEM_ID}}";
var PROBLEM_TYPE = "algo";
var STORAGE_KEY_PY = "algo_code_" + PROBLEM_ID + "_python";
var STORAGE_KEY_JA = "algo_code_" + PROBLEM_ID + "_java";
var hasCM = typeof CodeMirror !== "undefined";

function loadBlock(id) {
  var el = document.getElementById(id);
  return el ? el.textContent : "";
}

var tplPy = loadBlock("tmpl-python");
var tplJa = loadBlock("tmpl-java");

// ── Create editors (CodeMirror or fallback) ──
function makeEditor(id, mode, value) {
  if (!hasCM) {
    var ta = document.getElementById(id);
    ta.style.display = "block";
    ta.value = value;
    return {
      getValue: function() { return ta.value; },
      setValue: function(v) { ta.value = v; },
      refresh: function() {},
      setOption: function() {},
      on: function() {}
    };
  }
  return CodeMirror.fromTextArea(document.getElementById(id), {
    mode: mode,
    theme: "dracula",
    lineNumbers: true,
    matchBrackets: true,
    autoCloseBrackets: true,
    indentUnit: 4,
    tabSize: 4,
    indentWithTabs: false,
    smartIndent: true,
    electricChars: true,
    lineWrapping: false,
  });
}

var pyValue = (function() {
  try { return localStorage.getItem(STORAGE_KEY_PY) || tplPy; }
  catch(e) { return tplPy; }
})();
var jaValue = (function() {
  try { return localStorage.getItem(STORAGE_KEY_JA) || tplJa; }
  catch(e) { return tplJa; }
})();

var pyEditor = makeEditor("codePython", "python", pyValue);
var jaEditor = makeEditor("codeJava", "text/x-java", jaValue);

// Read-only answer editors
var pyAnswer = makeEditor("answerCodePython", "python", loadBlock("answer-python"));
pyAnswer.setOption("readOnly", true);
var jaAnswer = makeEditor("answerCodeJava", "text/x-java", loadBlock("answer-java"));
jaAnswer.setOption("readOnly", true);

// ── Auto-save ──
pyEditor.on("change", function() {
  try { localStorage.setItem(STORAGE_KEY_PY, pyEditor.getValue()); } catch(e) {}
});
jaEditor.on("change", function() {
  try { localStorage.setItem(STORAGE_KEY_JA, jaEditor.getValue()); } catch(e) {}
});

// ── Tab switch ──
function switchLang(lang) {
  document.querySelectorAll(".lang-tab").forEach(function(t) { t.classList.remove("active"); });
  document.querySelector('.lang-tab[data-lang="' + lang + '"]').classList.add("active");
  document.getElementById("editor-python").style.display = lang === "python" ? "block" : "none";
  document.getElementById("editor-java").style.display = lang === "java" ? "block" : "none";
  document.getElementById("answer-python-view").style.display = lang === "python" ? "block" : "none";
  document.getElementById("answer-java-view").style.display = lang === "java" ? "block" : "none";

  // Refresh the visible editor
  setTimeout(function() {
    (lang === "python" ? pyEditor : jaEditor).refresh();
  }, 10);
}

// ── Answer toggle ──
document.getElementById("answerToggle").addEventListener("click", function() {
  this.classList.toggle("expanded");
  document.getElementById("answerBody").classList.toggle("visible");
  setTimeout(function() {
    pyAnswer.refresh();
    jaAnswer.refresh();
  }, 50);
});

// ── Progress ──
async function markStatus(status) {
  var resp = await fetch("/api/progress/" + PROBLEM_TYPE + "/" + PROBLEM_ID + "?status=" + status, { method: "POST" });
  if (resp.ok) {
    document.querySelectorAll(".progress-toggle button").forEach(function(b) {
      if (b.classList.contains(status)) {
        b.style.background = "var(--green)"; b.style.color = "#fff";
      } else {
        b.style.background = "transparent"; b.style.color = "";
      }
    });
  }
}

// ── Initial refresh ──
setTimeout(function() { pyEditor.refresh(); }, 50);
</script>
</body>
</html>
