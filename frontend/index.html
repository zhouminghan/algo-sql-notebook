<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日一题 - 刷题平台</title>
<style>
  :root {
    --bg: #0f0f14;
    --card-bg: #1a1a24;
    --border: #2a2a3a;
    --text: #e0e0e0;
    --text-muted: #777;
    --accent: #6c5ce7;
    --accent-hover: #8675f5;
    --green: #00b894;
    --yellow: #fdcb6e;
    --red: #e17055;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  .container { max-width: 880px; margin: 0 auto; padding: 24px 20px; }

  header {
    text-align: center;
    padding: 36px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  header h1 { font-size: 1.7rem; font-weight: 700; }
  header .date { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

  /* progress */
  .progress-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 24px;
  }
  .progress-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .progress-card h3 { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .progress-card .count { font-size: 1.5rem; font-weight: 700; }
  .progress-card .count span { font-size: 0.8rem; color: var(--text-muted); font-weight: 400; }
  .progress-bar-bg {
    height: 5px;
    background: var(--border);
    border-radius: 3px;
    margin-top: 8px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.3s;
  }
  .progress-bar-fill.algo { background: var(--accent); }
  .progress-bar-fill.sql  { background: var(--green); }

  /* filters */
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .filters button {
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.82rem;
    transition: all 0.15s;
  }
  .filters button:hover { border-color: var(--accent); color: var(--text); }
  .filters button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* today */
  .today-banner {
    background: linear-gradient(135deg, #2d1f5e, #1a1a24);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .today-banner .icon { font-size: 1.3rem; }
  .today-banner a { color: var(--accent-hover); font-weight: 600; text-decoration: none; }
  .today-banner a:hover { text-decoration: underline; }

  /* list */
  .section-title {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin: 18px 0 8px;
  }
  .section-title:first-of-type { margin-top: 0; }

  .problem-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.12s;
    text-decoration: none;
    color: var(--text);
  }
  .problem-item:hover { background: var(--card-bg); }

  .problem-item .num {
    width: 36px;
    font-size: 0.75rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.pending { background: var(--border); }
  .status-dot.doing  { background: var(--yellow); }
  .status-dot.done   { background: var(--green); }
  .status-dot.review { background: var(--red); }

  .problem-item .title { flex: 1; font-size: 0.9rem; }
  .problem-item .tag {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .problem-item .tag.algo { background: #2d1f5e; color: var(--accent-hover); }
  .problem-item .tag.sql  { background: #1a3a2a; color: var(--green); }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>每日一题 · Algo Practice</h1>
    <p class="date">力扣 Hot 100 + SQL 高级场景 · Docker 本地部署</p>
  </header>

  <div class="progress-section">
    <div class="progress-card">
      <h3>算法 Hot 100</h3>
      <div class="count" id="algo-count">0 <span>/ 100</span></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill algo" id="algo-bar" style="width:0%"></div></div>
    </div>
    <div class="progress-card">
      <h3>SQL 高级场景</h3>
      <div class="count" id="sql-count">0 <span>/ ∞</span></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill sql" id="sql-bar" style="width:0%"></div></div>
    </div>
  </div>

  <div class="today-banner" id="today-banner" style="display:none">
    <span class="icon">📌</span>
    <span>今日题目：<a href="#" id="today-link"></a></span>
  </div>

  <div class="filters">
    <button class="active" data-filter="all">全部</button>
    <button data-filter="algo">算法</button>
    <button data-filter="sql">SQL</button>
    <button data-filter="pending">待做</button>
    <button data-filter="done">已完成</button>
  </div>

  <div id="problem-list"></div>
</div>

<script>
let problems = { algo: [], sql: [] };
let progress = {};
var STORAGE_KEY = "algo-practice-progress";

async function load() {
  try {
    const resp = await fetch('/index.json');
    const data = await resp.json();
    problems = { algo: data.algo || [], sql: data.sql || [] };
  } catch(e) {
    // fallback: empty lists
    problems = { algo: [], sql: [] };
  }

  // Load progress from localStorage
  progress = { algo: {}, sql: {} };
  try {
    var raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    problems.algo.forEach(p => progress.algo[p.id] = raw["algo/" + p.id] || null);
    problems.sql.forEach(p => progress.sql[p.id] = raw["sql/" + p.id] || null);
  } catch(e) { /* keep empty progress */ }

  renderProgress();
  renderList('all');
}

function renderProgress() {
  const algoDone = Object.values(progress.algo).filter(s => s === 'done').length;
  const sqlDone = Object.values(progress.sql).filter(s => s === 'done').length;
  const algoTotal = problems.algo.length || 1;
  const sqlTotal = problems.sql.length || 1;

  document.getElementById('algo-count').innerHTML = `${algoDone} <span>/ ${algoTotal}</span>`;
  document.getElementById('sql-count').innerHTML = `${sqlDone} <span>/ ${sqlTotal}</span>`;
  document.getElementById('algo-bar').style.width = algoTotal ? (algoDone / algoTotal * 100) + '%' : '0%';
  document.getElementById('sql-bar').style.width = sqlTotal ? (sqlDone / sqlTotal * 100) + '%' : '0%';

  const firstPendingAlgo = problems.algo.find(p => !progress.algo[p.id]);
  const firstPendingSql = problems.sql.find(p => !progress.sql[p.id]);
  const today = firstPendingAlgo || firstPendingSql;
  const banner = document.getElementById('today-banner');
  if (today) {
    banner.style.display = 'flex';
    document.getElementById('today-link').textContent = today.title;
    document.getElementById('today-link').href = `/${today.type}/${today.id}`;
  }
}

function renderList(filter) {
  const container = document.getElementById('problem-list');
  container.innerHTML = '';

  if (filter === 'all' || filter === 'algo') {
    container.appendChild(sectionHTML('力扣 Hot 100', 'algo', problems.algo, filter));
  }
  if (filter === 'all' || filter === 'sql') {
    container.appendChild(sectionHTML('SQL 高级场景', 'sql', problems.sql, filter));
  }
}

function extractNum(id, type) {
  if (type === 'algo') {
    const m = id.match(/^(\d+)/);
    return m ? parseInt(m[1]) : '';
  }
  const m = id.match(/^SQL(\d+)/);
  return m ? parseInt(m[1]) : '';
}

function sectionHTML(label, type, items, filter) {
  const div = document.createElement('div');
  div.innerHTML = `<div class="section-title">${label}</div>`;

  const fragments = [];
  items.forEach((p, idx) => {
    const s = progress[type]?.[p.id] || null;
    const dotClass = s === 'done' ? 'done' : s === 'review' ? 'review' : 'pending';
    if (filter === 'pending' && s === 'done') return;
    if (filter === 'done' && s !== 'done') return;

    const num = extractNum(p.id, type);
    fragments.push(`
      <a class="problem-item" href="/${type}/${p.id}">
        <span class="num">${num ? '#' + num : ''}</span>
        <span class="status-dot ${dotClass}"></span>
        <span class="title">${p.title}</span>
        <span class="tag ${type}">${type === 'algo' ? '算法' : 'SQL'}</span>
      </a>
    `);
  });

  div.innerHTML += fragments.join('');
  return div;
}

document.querySelector('.filters').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  renderList(e.target.dataset.filter);
});

load();
</script>
</body>
</html>
