<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} - 每日一题 SQL</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<style>
  :root {
    --bg: #0f0f14; --code-bg: #1e1e2e; --border: #2a2a3a;
    --text: #e0e0e0; --text-muted: #777; --accent: #6c5ce7;
    --green: #00b894; --yellow: #fdcb6e; --red: #e17055;
    --keyword: #c792ea; --func: #82aaff; --string: #c3e88d;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: #12121a; position: sticky; top: 0; z-index: 10;
  }
  .topbar h1 { font-size: 1.15rem; }
  .topbar .back-btn {
    padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-muted); text-decoration: none; font-size: 0.8rem;
  }
  .topbar .back-btn:hover { border-color: var(--accent); color: var(--text); }
  .progress-toggle { display: flex; gap: 5px; margin-left: auto; }
  .progress-toggle button {
    padding: 4px 10px; border: 1px solid var(--border); border-radius: 5px;
    background: transparent; color: var(--text-muted); font-size: 0.72rem; cursor: pointer;
  }
  .progress-toggle button.done { border-color: var(--green); color: var(--green); }
  .progress-toggle button.done:hover { background: var(--green); color: #fff; }
  .progress-toggle button.review { border-color: var(--yellow); color: var(--yellow); }
  .progress-toggle button.review:hover { background: var(--yellow); color: #111; }

  .layout { display: flex; height: calc(100vh - 53px); }

  /* ── left panel ── */
  .left-panel {
    overflow-y: auto; background: #12121a; padding: 20px;
    flex: none;
  }
  .v-splitter {
    width: 6px; cursor: col-resize; background: #1a1a28;
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .v-splitter:hover { background: #2a2a40; }
  .v-splitter:active { background: var(--accent); }
  .v-splitter .grip-v {
    width: 2px; height: 28px; background: var(--text-muted); border-radius: 1px;
  }
  .left-panel h3 { color: var(--accent); font-size: 0.95rem; margin-bottom: 10px; }
  .scenario {
    background: #1a1a28; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 14px; font-size: 0.85rem; line-height: 1.6;
  }
  .scenario .note { color: var(--text-muted); font-style: italic; font-size: 0.8rem; }
  .scenario ul { padding-left: 18px; margin: 6px 0; }
  .scenario li { font-size: 0.85rem; margin-bottom: 3px; color: var(--text); }
  .scenario li b { color: var(--accent); }
  .scenario table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin: 8px 0; white-space: nowrap; }
  .scenario th, .scenario td { padding: 4px 8px; border: 1px solid var(--border); text-align: left; }
  .scenario th { background: #1a1a28; color: var(--text-muted); font-weight: 500; }
  .scenario code { color: var(--green); font-family: "SF Mono","Monaco","Menlo",monospace; font-size: 0.84rem; }
  .scenario p { margin-bottom: 4px; }

  .table-info { margin-bottom: 14px; }
  .table-info { overflow-x: auto; margin-bottom: 14px; }
  .table-info h4 { color: var(--yellow); font-size: 0.82rem; margin-bottom: 6px; }
  .table-info table { min-width: 100%; border-collapse: collapse; font-size: 0.78rem; white-space: nowrap; }
  .table-info th,.table-info td { padding: 5px 10px; border: 1px solid var(--border); text-align: left; }
  .table-info th { background: #1a1a28; color: var(--text-muted); font-weight: 500; }
  .table-info td code { color: var(--green); font-size: 0.78rem; }
  .table-info.sample td { color: var(--text); }

  .expected-table {
    border: 1px solid var(--border); border-radius: 6px; margin-bottom: 14px;
    overflow-x: auto;
  }
  .expected-table h4 {
    padding: 8px 14px; background: #1a1a28; font-size: 0.82rem;
    color: var(--yellow); border-bottom: 1px solid var(--border);
  }
  .expected-table table { min-width: 100%; border-collapse: collapse; font-size: 0.78rem; white-space: nowrap; }
  .expected-table th,.expected-table td { padding: 5px 12px; border: 1px solid var(--border); text-align: left; }
  .expected-table th { background: #1a1a28; color: var(--text-muted); }
  .expected-note { padding: 8px 14px; font-size: 0.78rem; color: var(--text-muted); }

  .collapsible {
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 12px;
  }
  .collapsible-toggle {
    width: 100%; padding: 9px 14px; background: #1a1a28;
    border: none; color: var(--text); text-align: left; cursor: pointer;
    font-size: 0.85rem; display: flex; justify-content: space-between;
  }
  .collapsible-toggle:hover { background: #222238; }
  .collapsible-toggle .arrow { transition: transform 0.2s; font-size: 0.7rem; }
  .collapsible-toggle.open .arrow { transform: rotate(90deg); }
  .collapsible-body {

  /* SQL playback button */
  .playback-btn-sql {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 10px 14px; margin: 10px 0; border-radius: 8px;
    background: linear-gradient(135deg, #2d1f5e, #1a3a4a);
    border: 1px solid var(--accent); color: #fff;
    cursor: pointer; font-size: 0.82rem; font-weight: 600;
  }
  .playback-btn-sql:hover { filter: brightness(1.2); }

  /* SQL modal */
  .modal-overlay {
    display: none;
    position: fixed !important;
    top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
    width: 100vw !important; height: 100vh !important;
    background: rgba(0, 0, 0, 0.85);
    z-index: 9999 !important;
    justify-content: center; align-items: center;
  }
  .modal-overlay.open { display: flex !important; }

  .modal-dialog {
    background: linear-gradient(145deg, #1a1a28, #12121a);
    border: 1px solid rgba(108, 92, 231, 0.4);
    border-radius: 16px;
    width: min(95vw, 1150px); height: min(85vh, 680px);
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow:
      0 0 40px rgba(108, 92, 231, 0.25),
      0 20px 60px rgba(0, 0, 0, 0.7),
      inset 0 1px 0 rgba(255, 255, 255, 0.02);
    animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.92) translateY(-10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px;
    background: linear-gradient(180deg, rgba(108,92,231,0.1), transparent);
    border-bottom: 1px solid rgba(108, 92, 231, 0.2);
    flex-shrink: 0;
  }
  .modal-titlebar h3 { font-size: 1rem; letter-spacing: 0.3px; }
  .modal-titlebar .close-modal {
    width: 32px; height: 32px; border-radius: 8px; border: none;
    background: rgba(255,255,255,0.05); color: var(--text-muted);
    font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .modal-titlebar .close-modal:hover { background: rgba(255,0,0,0.15); color: var(--red); }

  .modal-body { flex: 1; display: flex; overflow: hidden; min-height: 0; }

  .modal-controls {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 12px 20px;
    border-top: 1px solid rgba(108, 92, 231, 0.2);
    background: rgba(108, 92, 231, 0.04);
    flex-shrink: 0;
  }
  .modal-controls button {
    padding: 7px 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
    background: rgba(255,255,255,0.03); color: var(--text); font-size: 0.82rem;
    cursor: pointer; transition: all 0.15s;
  }
  .modal-controls button:hover { border-color: var(--accent); background: rgba(108,92,231,0.1); }
  .modal-controls button:disabled { opacity: 0.2; cursor: default; }
  .modal-controls .btn-play {
    background: var(--accent); border-color: var(--accent); color: #fff;
    min-width: 90px; justify-content: center; font-weight: 600;
  }
  .modal-controls .btn-play:hover { filter: brightness(1.15); }
  .speed-label { font-size: 0.68rem; color: var(--text-muted); margin: 0 2px; }
  .modal-controls input[type=range] { width: 80px; accent-color: var(--accent); }

  .sql-modal-left {
    width: 280px; padding: 18px;
    background: rgba(0,0,0,0.15); border-right: 1px solid rgba(108, 92, 231, 0.15);
    overflow-y: auto; flex-shrink: 0;
  }
  .sql-modal-right { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .sql-modal-code {
    background: rgba(0,0,0,0.2); padding: 14px 16px;
    border-bottom: 1px solid rgba(108, 92, 231, 0.15);
    flex-shrink: 0; max-height: 40%; overflow-y: auto;
  }
  .sql-modal-code .sql-code-label {
    font-size: 0.68rem; color: var(--accent); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .sql-modal-code pre {
    font-family: "SF Mono","Monaco","Menlo",monospace; font-size: 11.5px;
    color: var(--text); white-space: pre-wrap; margin: 0;
    line-height: 1.55;
  }
  .sql-modal-table-wrap { flex: 1; overflow: auto; padding: 14px 16px; }
  .sql-modal-table-wrap table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  .sql-modal-table-wrap th {
    padding: 7px 12px; background: rgba(108,92,231,0.1);
    color: var(--text-muted); text-align: left; white-space: nowrap;
    position: sticky; top: 0; font-weight: 500;
  }
  .sql-modal-table-wrap td {
    padding: 6px 12px; border-top: 1px solid rgba(255,255,255,0.04);
    transition: background 0.2s;
  }
  .sql-modal-table-wrap .hl-col {
    background: rgba(108, 92, 231, 0.2);
    color: var(--accent); font-weight: 600;
  }
  .sql-step-label {
    font-size: 0.65rem; color: var(--accent); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .sql-step-title { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
  .sql-step-desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; }
  .step-indicator { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .step-dot {
    width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.08);
    cursor: pointer; transition: all 0.2s;
  }
  .step-dot.done { background: var(--accent); }
  .step-dot.current { background: #fff; transform: scale(1.4); box-shadow: 0 0 8px rgba(255,255,255,0.3); }
    display: none; padding: 12px 14px; border-top: 1px solid var(--border);
    background: var(--code-bg); font-size: 0.82rem;
  }
  .collapsible-body.visible { display: block; }

  .domain-k-body { padding: 0; }
  .domain-k-body .dk-note { padding: 8px 12px; color: var(--text-muted); font-size: 0.78rem; border-bottom: 1px solid var(--border); }
  .domain-k-body table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  .domain-k-body th,.domain-k-body td { padding: 6px 10px; border: 1px solid var(--border); text-align: left; }
  .domain-k-body th { background: #1a1a28; color: var(--accent); font-weight: 500; font-size: 0.75rem; }
  .domain-k-body td:first-child { color: var(--yellow); font-weight: 600; white-space: nowrap; }
  .domain-k-body td:nth-child(2) { color: var(--text-muted); font-style: italic; }
  .domain-k-body td:last-child { color: var(--text); line-height: 1.5; }

  .hint-step { margin-bottom: 8px; padding: 8px 10px; background: #1a1a28; border-radius: 6px; font-size: 0.82rem; }
  .hint-item { margin: 4px 0 4px 10px; color: var(--text-muted); font-size: 0.8rem; }

  .section-box {
    background: #1a1515; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px;
  }
  .section-box h4 { color: var(--red); font-size: 0.8rem; margin-bottom: 4px; }
  .section-box ul { padding-left: 16px; font-size: 0.8rem; color: var(--text-muted); }
  .section-box li { margin-bottom: 2px; }

  /* ── right panel with splitter ── */
  .right-panel {
    flex: 1; min-width: 200px; display: flex; flex-direction: column;
    background: var(--bg); position: relative; overflow: hidden;
  }

  .editor-area { min-height: 120px; overflow: hidden; }
  .sql-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; background: #1a1a28; border-bottom: 1px solid var(--border);
  }
  .sql-toolbar .hint { color: var(--text-muted); font-size: 0.72rem; }
  .sql-toolbar .run-btn {
    padding: 5px 14px; background: var(--green); border: none;
    border-radius: 6px; color: #fff; cursor: pointer; font-size: 0.82rem; font-weight: 600;
  }
  .sql-toolbar .run-btn:hover { opacity: 0.85; }
  .sql-toolbar .run-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

  /* CodeMirror override */
  .CodeMirror {
    height: 100% !important;
    font-family: "SF Mono","Monaco","Menlo",monospace;
    font-size: 14px;
  }

  /* ── draggable splitter ── */
  .splitter {
    height: 6px; cursor: row-resize; background: #1a1a28;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .splitter:hover { background: #2a2a40; }
  .splitter:active { background: var(--accent); }
  .splitter .grip {
    width: 28px; height: 2px; background: var(--text-muted);
    border-radius: 1px;
  }

  .result-area { flex: 1; overflow-y: auto; min-height: 60px; }
  .result-header {
    padding: 8px 14px; background: #1a1a28; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; font-size: 0.82rem;
    position: sticky; top: 0; z-index: 5;
  }
  .result-header .row-count { color: var(--text-muted); }
  .result-table {
    width: 100%; border-collapse: collapse; font-size: 0.78rem;
  }
  .result-table th,.result-table td {
    padding: 6px 12px; border: 1px solid var(--border); text-align: left;
  }
  .result-table th { background: #1a1a28; color: var(--accent); position: sticky; top: 33px; }
  .result-error { padding: 14px; color: var(--red); font-size: 0.82rem; }

  .result-placeholder {
    padding: 40px 14px; text-align: center; color: var(--text-muted);
    font-size: 0.82rem;
  }

  @media (max-width: 768px) {
    .layout { flex-direction: column; }
    .left-panel,.right-panel { width: 100%; }
    .left-panel { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="back-btn">← 返回</a>
  <h1>{{TITLE}}</h1>
  <div class="progress-toggle">
    <button class="done" onclick="markStatus('done')">✓ 掌握</button>
    <button class="review" onclick="markStatus('review')">⚠ 复习</button>
  </div>
</div>

<div class="layout">
  <div class="left-panel">
    <h3>场景描述</h3>
    <div class="scenario">{{DESCRIPTION}}</div>

    {{DOMAIN_KNOWLEDGE}}

    {{TABLE_SCHEMA}}
    {{SAMPLE_DATA}}

    <div class="expected-table" id="expectedBlock">
      <h4>📊 期望结果</h4>
      {{EXPECTED}}
    </div>

    <div class="collapsible" id="hintsSection">
      <button class="collapsible-toggle" id="hintsToggle" onclick="openSqlPlayback()">
        <span>💡 解题思路</span><span class="arrow">▶</span>
      </button>
      <div class="collapsible-body">{{HINTS}}</div>
    </div>

    <div class="collapsible" id="answerSection">
      <button class="collapsible-toggle" onclick="toggleSection(this)">
        <span>📖 参考答案</span><span class="arrow">▶</span>
      </button>
      <div class="collapsible-body"><textarea id="answerCodeTA" readonly style="display:none">{{ANSWER_SQL}}</textarea></div>
    </div>

    <div class="section-box" id="gotchasBlock">
      <h4>⚠️ 易错点</h4>
      <ul>{{GOTCHAS}}</ul>
    </div>
  </div>

  <div class="v-splitter" id="vSplitter">
    <div class="grip-v"></div>
  </div>

  <div class="right-panel">
    <div class="editor-area" id="editorArea">
      <div class="sql-toolbar">
        <span class="hint">Ctrl+Enter 执行</span>
        <button class="run-btn" id="runBtn" onclick="executeSQL()">▶ 运行</button>
      </div>
      <textarea id="sqlEditorTA"></textarea>
    </div>

    <div class="splitter" id="splitter">
      <div class="grip"></div>
    </div>

    <div class="result-area" id="resultArea">
      <div class="result-header">
        <span>📊 查询结果</span>
        <span class="row-count" id="rowCount"></span>
      </div>
      <div id="resultBody">
        <div class="result-placeholder">↑ 输入 SQL 并按 Ctrl+Enter 执行</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script>
var PROBLEM_ID = "{{PROBLEM_ID}}";
var PROBLEM_TYPE = "sql";

var hasCM = typeof CodeMirror !== "undefined";

// ── CodeMirror SQL editor (with fallback) ──
var sqlEditor, answerEditor;
if (hasCM) {
  sqlEditor = CodeMirror.fromTextArea(document.getElementById("sqlEditorTA"), {
  mode: "text/x-sql",
  theme: "dracula",
  lineNumbers: true,
  matchBrackets: true,
  autoCloseBrackets: true,
  indentUnit: 2,
  tabSize: 2,
  smartIndent: true,
  lineWrapping: false,
  extraKeys: {
    "Ctrl-Enter": executeSQL,
    "Cmd-Enter": executeSQL
  }
});
var answerTA = document.getElementById("answerCodeTA");
answerEditor = CodeMirror.fromTextArea(answerTA, {
  mode: "text/x-sql",
  theme: "dracula",
  lineNumbers: true,
  readOnly: true,
  indentUnit: 2,
});
} else {
  // Fallback: plain textarea
  var sqlTA = document.getElementById("sqlEditorTA");
  sqlTA.style.display = "block";
  sqlEditor = sqlTA;
  sqlEditor.getValue = function() { return sqlTA.value; };
  sqlEditor.refresh = function() {};
  var aTA = document.getElementById("answerCodeTA");
  aTA.style.display = "block";
  aTA.readOnly = true;
  answerEditor = { refresh: function() {}, getValue: function() { return ""; } };
}

// ═════════════════════════════════════════════
//  Draggable Splitter
// ═════════════════════════════════════════════
var splitter = document.getElementById("splitter");
var editorArea = document.getElementById("editorArea");
var resultArea = document.getElementById("resultArea");
var rightPanel = document.querySelector(".right-panel");
var isDragging = false;
var rightPanelHeight = 0;

function setSplit(fraction) {
  var totalH = rightPanel.clientHeight - splitter.offsetHeight;
  fraction = Math.max(0.15, Math.min(0.85, fraction));
  editorArea.style.height = (totalH * fraction) + "px";
  editorArea.style.flex = "none";
  resultArea.style.flex = "none";
  resultArea.style.height = (totalH * (1 - fraction)) + "px";
  sqlEditor.refresh();
}

// Default 50/50 split, but only after CodeMirror is rendered
setTimeout(function() {
  rightPanelHeight = rightPanel.clientHeight;
  setSplit(0.5);
}, 200);

splitter.addEventListener("mousedown", function(e) {
  isDragging = true;
  document.body.style.cursor = "row-resize";
  document.body.style.userSelect = "none";
  rightPanelHeight = rightPanel.clientHeight;
  e.preventDefault();
});

document.addEventListener("mousemove", function(e) {
  if (!isDragging) return;
  var rect = rightPanel.getBoundingClientRect();
  var offsetY = e.clientY - rect.top - splitter.offsetHeight / 2;
  var totalH = rightPanelHeight - splitter.offsetHeight;
  var fraction = offsetY / totalH;
  setSplit(fraction);
});

document.addEventListener("mouseup", function() {
  if (isDragging || isDraggingV) {
    isDragging = false;
    isDraggingV = false;
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
    sqlEditor.refresh();
  }
});

// Handle window resize
window.addEventListener("resize", function() {
  sqlEditor.refresh();
});

// ═════════════════════════════════════════════
//  Vertical Splitter (left ↔ right panels)
// ═════════════════════════════════════════════
var vSplitter = document.getElementById("vSplitter");
var leftPanel = document.querySelector(".left-panel");
var layoutDiv = document.querySelector(".layout");
var isDraggingV = false;
var layoutWidth = 0;

function setVSplit(leftPx) {
  var totalW = layoutDiv.clientWidth - vSplitter.offsetWidth;
  var minW = 280;
  var maxW = totalW - 300;
  leftPx = Math.max(minW, Math.min(maxW, leftPx));
  leftPanel.style.width = leftPx + "px";
  sqlEditor.refresh();
}

setTimeout(function() {
  layoutWidth = layoutDiv.clientWidth;
  setVSplit(layoutWidth * 0.38);
}, 100);

vSplitter.addEventListener("mousedown", function(e) {
  isDraggingV = true;
  document.body.style.cursor = "col-resize";
  document.body.style.userSelect = "none";
  layoutWidth = layoutDiv.clientWidth;
  e.preventDefault();
});

document.addEventListener("mousemove", function(e) {
  if (isDraggingV) {
    var rect = layoutDiv.getBoundingClientRect();
    var offsetX = e.clientX - rect.left;
    setVSplit(offsetX);
  }
  // (horizontal splitter handled below in its own check)
});

// ═════════════════════════════════════════════
//  Execute SQL
// ═════════════════════════════════════════════
async function executeSQL() {
  var sql = sqlEditor.getValue().trim();
  if (!sql) return;
  var btn = document.getElementById("runBtn");
  btn.disabled = true; btn.textContent = "⏳ ...";
  try {
    var resp = await fetch("/api/sql/execute?sql=" + encodeURIComponent(sql), { method: "POST" });
    if (!resp.ok) { var err = await resp.json(); showError(err.detail || "执行失败"); return; }
    var data = await resp.json();
    document.getElementById("rowCount").textContent = data.row_count + " 行";
    renderTable(data.columns, data.rows);
  } catch (e) {
    showError("网络错误: " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = "▶ 运行";
  }
}

function renderTable(columns, rows) {
  var body = document.getElementById("resultBody");
  if (!columns.length && !rows.length) {
    body.innerHTML = '<div class="result-placeholder">查询执行成功，无返回数据</div>';
    return;
  }
  var h = '<table class="result-table"><thead><tr>';
  for (var i = 0; i < columns.length; i++) h += "<th>" + columns[i] + "</th>";
  h += "</tr></thead><tbody>";
  for (var r = 0; r < rows.length; r++) {
    h += "<tr>";
    for (var c = 0; c < rows[r].length; c++) {
      h += "<td>" + (rows[r][c] === null ? '<i style="color:#555">NULL</i>' : String(rows[r][c])) + "</td>";
    }
    h += "</tr>";
  }
  h += "</tbody></table>";
  body.innerHTML = h;
}

function showError(msg) {
  document.getElementById("rowCount").textContent = "";
  document.getElementById("resultBody").innerHTML = '<div class="result-error">' + msg + "</div>";
}

// ── Toggle sections ──
function toggleSection(btn) {
  btn.classList.toggle("open");
  btn.nextElementSibling.classList.toggle("visible");
  if (btn.closest("#answerSection")) {
    setTimeout(function() { answerEditor.refresh(); }, 50);
  }
}

// ── Progress ──
async function markStatus(status) {
  var resp = await fetch("/api/progress/" + PROBLEM_TYPE + "/" + PROBLEM_ID + "?status=" + status, { method: "POST" });
  if (resp.ok) {
    document.querySelectorAll(".progress-toggle button").forEach(function(b) {
      if (b.classList.contains(status)) {
        b.style.background = "var(--green)"; b.style.color = "#fff";
      } else {
        b.style.background = "transparent"; b.style.color = "";
      }
    });
  }
}
</script>

<!-- ═══════════════════════════════════════════════════ -->
<!--  SQL Walkthrough 步骤回放弹窗                     -->
<!-- ═══════════════════════════════════════════════════ -->
<div class="modal-overlay" id="sqlPlaybackModal">
  <div class="modal-dialog">
    <div class="modal-titlebar">
      <h3>🎮 SQL 执行过程回放</h3>
      <button class="close-modal" onclick="closeSqlPlayback()">&times;</button>
    </div>
    <div class="modal-body sql-modal-body">
      <div class="sql-modal-left">
        <div class="sql-modal-steps" id="sqlStepDots"></div>
        <div class="sql-modal-info" id="sqlStepInfo"></div>
      </div>
      <div class="sql-modal-right">
        <div class="sql-modal-code" id="sqlStepSql"></div>
        <div class="sql-modal-table-wrap" id="sqlStepTable"></div>
      </div>
    </div>
    <div class="modal-controls">
      <button onclick="sqlPlayerPrev()" id="sqlBtnPrev">⏮ 上一步</button>
      <button onclick="sqlPlayerReset()" id="sqlBtnReset">↻ 重置</button>
      <button class="btn-play" onclick="sqlPlayerTogglePlay()" id="sqlBtnPlay">▶ 播放</button>
      <button onclick="sqlPlayerNext()" id="sqlBtnNext">下一步 ⏭</button>
      <span class="speed-label">慢</span>
      <input type="range" min="500" max="3000" value="1200" step="100" id="sqlSpeedSlider" oninput="sqlPlayerSetSpeed(this.value)">
      <span class="speed-label">快</span>
      <span style="font-size:0.72rem;color:var(--text-muted);margin-left:8px" id="sqlStepCounter">0/0</span>
    </div>
  </div>
</div>

<script>
var SQL_WALKTHROUGH_DATA = null;
try {
  var _sqlRaw = {{SQL_WALKTHROUGH_JSON}};
  if (_sqlRaw && typeof _sqlRaw === "object") SQL_WALKTHROUGH_DATA = _sqlRaw;
} catch(e) { SQL_WALKTHROUGH_DATA = null; }
console.log("[algo-practice] SQL walkthrough loaded, steps:", SQL_WALKTHROUGH_DATA ? SQL_WALKTHROUGH_DATA.steps.length : 0, "| page build: {{BUILD_TIME}}");

var sqlPlayer = { current: 0, playing: false, timer: null, speed: 1200 };
function escHtml(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function openSqlPlayback() {
  if (!SQL_WALKTHROUGH_DATA || !SQL_WALKTHROUGH_DATA.steps || !SQL_WALKTHROUGH_DATA.steps.length) {
    alert("⚠️ 该题目暂不支持解题过程回放。后续会逐步覆盖更多题型。");
    return;
  }
  var overlay = document.getElementById("sqlPlaybackModal");
  overlay.style.display = "flex";
  overlay.style.position = "fixed";
  overlay.style.top = "0";
  overlay.style.left = "0";
  overlay.style.width = "100vw";
  overlay.style.height = "100vh";
  overlay.style.zIndex = "99999";
  overlay.style.background = "rgba(0,0,0,0.85)";
  overlay.style.justifyContent = "center";
  overlay.style.alignItems = "center";
  document.body.style.overflow = "hidden";
  sqlPlayer.current = 0;
  renderSqlStep();
}
function closeSqlPlayback() {
  sqlPause();
  var overlay = document.getElementById("sqlPlaybackModal");
  overlay.style.display = "none";
  document.body.style.overflow = "";
}

function renderSqlStep() {
  var steps = SQL_WALKTHROUGH_DATA.steps;
  var idx = sqlPlayer.current;
  var s = steps[idx];
  if (!s) return;

  // Step dots
  var dotsHtml = '<div class="step-indicator">';
  for (var i = 0; i < steps.length; i++) {
    var cls = "step-dot";
    if (i < idx) cls += " done";
    else if (i === idx) cls += " current";
    dotsHtml += '<span class="' + cls + '" onclick="sqlPlayerGoTo(' + i + ')"></span>';
  }
  dotsHtml += '</div>';
  document.getElementById("sqlStepDots").innerHTML = dotsHtml;

  // Info
  document.getElementById("sqlStepInfo").innerHTML =
    '<div class="sql-step-label">步骤 ' + (idx + 1) + ' / ' + steps.length + '</div>' +
    '<div class="sql-step-title">' + s.label + '</div>' +
    '<div class="sql-step-desc">' + s.desc + '</div>';

  // SQL code
  document.getElementById("sqlStepSql").innerHTML =
    '<div class="sql-code-label">执行 SQL</div><pre>' + escHtml(s.sql) + '</pre>';

  // Table
  var cols = s.columns, rows = s.rows;
  var tableHtml = '<table><thead><tr>';
  for (var c = 0; c < cols.length; c++) {
    var isHl = s.hl && s.hl === cols[c];
    tableHtml += '<th' + (isHl ? ' class="hl-col"' : '') + '>' + cols[c] + '</th>';
  }
  tableHtml += '</tr></thead><tbody>';
  for (var r = 0; r < rows.length; r++) {
    tableHtml += '<tr>';
    for (var c = 0; c < rows[r].length; c++) {
      var isHl = s.hl && s.hl === cols[c];
      tableHtml += '<td' + (isHl ? ' class="hl-col"' : '') + '>' + rows[r][c] + '</td>';
    }
    tableHtml += '</tr>';
  }
  tableHtml += '</tbody></table>';
  document.getElementById("sqlStepTable").innerHTML = tableHtml;

  // Counter + buttons
  document.getElementById("sqlStepCounter").textContent = (idx + 1) + "/" + steps.length;
  document.getElementById("sqlBtnPrev").disabled = idx === 0;
  document.getElementById("sqlBtnNext").disabled = idx >= steps.length - 1;
}

function sqlPlayerGoTo(i) { sqlPause(); sqlPlayer.current = Math.max(0, Math.min(SQL_WALKTHROUGH_DATA.steps.length - 1, i)); renderSqlStep(); }
function sqlPlayerNext() { if (sqlPlayer.current < SQL_WALKTHROUGH_DATA.steps.length - 1) sqlPlayerGoTo(sqlPlayer.current + 1); else sqlPause(); }
function sqlPlayerPrev() { sqlPlayerGoTo(sqlPlayer.current - 1); }
function sqlPlayerReset() { sqlPlayerGoTo(0); }
function sqlPlayerTogglePlay() { sqlPlayer.playing ? sqlPause() : sqlPlay(); }
function sqlPlay() {
  if (sqlPlayer.current >= SQL_WALKTHROUGH_DATA.steps.length - 1) { sqlPlayer.current = 0; renderSqlStep(); }
  sqlPlayer.playing = true; document.getElementById("sqlBtnPlay").innerHTML = "⏸ 暂停"; sqlAdvance();
}
function sqlPause() { sqlPlayer.playing = false; document.getElementById("sqlBtnPlay").innerHTML = "▶ 播放"; if (sqlPlayer.timer) { clearTimeout(sqlPlayer.timer); sqlPlayer.timer = null; } }
function sqlAdvance() {
  if (!sqlPlayer.playing) return;
  if (sqlPlayer.current >= SQL_WALKTHROUGH_DATA.steps.length - 1) { sqlPause(); return; }
  sqlPlayerGoTo(sqlPlayer.current + 1);
  if (sqlPlayer.playing) sqlPlayer.timer = setTimeout(sqlAdvance, sqlPlayer.speed);
}
function sqlPlayerSetSpeed(v) { sqlPlayer.speed = parseInt(v); if (sqlPlayer.playing) { sqlPause(); sqlPlay(); } }

// Keyboard
document.addEventListener("keydown", function(e) {
  var m = document.getElementById("sqlPlaybackModal");
  if (!m.classList.contains("open")) return;
  if (e.key === "Escape") { closeSqlPlayback(); return; }
  if (e.key === "ArrowRight") { e.preventDefault(); sqlPlayerNext(); return; }
  if (e.key === "ArrowLeft") { e.preventDefault(); sqlPlayerPrev(); return; }
  if (e.key === " ") { e.preventDefault(); sqlPlayerTogglePlay(); return; }
});
document.getElementById("sqlPlaybackModal").addEventListener("click", function(e) { if (e.target === this) closeSqlPlayback(); });
</script>
</body>
</html>
