<script>
/*
 * GitHub Pages 会把 404.html 渲染到任意深度的 URL 上（如 /repo/a/b），
 * 那样相对路径 assets/... 就会解析错。这里先算出站点根目录再补 <base>，
 * 本地预览（localhost / file://）则退回 ./。
 */
(function () {
  var host = location.hostname;
  var local = host === 'localhost' || host === '127.0.0.1' || host === '';
  var root = local ? './' : '/' + (location.pathname.split('/')[1] || '') + '/';
  document.write('<base href="' + root + '">');
})();
</script>
<script>
(function () {
  try {
    var s = localStorage.getItem('asn-theme');
    var d = s || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', d);
  } catch (e) {}
})();
</script>
