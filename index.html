<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>

<script>
(function () {
  // localStorage 在隐私模式/受限环境可能抛异常，兜底回退到系统偏好
  try {
    var s = localStorage.getItem('asn-theme');
    var d = s || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', d);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/problems.js"></script>

<main class="index-body">
  <section class="index-hero">

  <div class="index-toolbar">

      <button type="button" class="filter-chip active" data-diff="all">全部难度</button>
      <button type="button" class="filter-chip" data-diff="easy">简单</button>
