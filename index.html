<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>algo-sql-notebook · 算法 + SQL 图解题库</title>
<script>
(function () {
  var s = localStorage.getItem('asn-theme');
  var d = s || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>
<link rel="stylesheet" href="assets/vendor/pico.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/problems.js"></script>
<script src="assets/js/common.js"></script>
</head>
<body>

<main class="index-body">
  <div class="hero">
    <h1><span class="accent">算法 + SQL</span> 图解题库</h1>
    <p>LeetCode Hot 100 · 字节 / SHEIN 机试题 · 纯静态 · 零构建 · 图解码题</p>
    <div class="hero-stats" id="heroStats"></div>
  </div>

  <section id="algoSection">
    <h2 class="section-title">💻 算法 <span class="section-count" id="algoCount"></span></h2>
    <ul class="prob-grid" id="algoGrid"></ul>
  </section>

  <section id="sqlSection" style="margin-top:2.5rem;">
    <h2 class="section-title">🗄️ SQL 高级题 <span class="section-count" id="sqlCount"></span></h2>
    <ul class="prob-grid" id="sqlGrid"></ul>
  </section>

  <div class="empty-state" id="emptyState" style="display:none;">没有匹配的题目</div>
</main>

<script>
const DIFF_MAP = { easy: '简单', medium: '中等', hard: '困难' };
const DIFF_CLASS = { easy: 'tag-easy', medium: 'tag-medium', hard: 'tag-hard' };
let query = '';

function implemented(list) { return list.filter(p => p.file); }

function matches(p) {
  if (!query) return true;
  const q = query.toLowerCase();
  return (p.title + ' ' + (p.tags || []).join(' ') + ' ' + p.id).toLowerCase().indexOf(q) !== -1;
}

function renderStats() {
  const all = implemented(ASN.PROBLEMS.algo).concat(implemented(ASN.PROBLEMS.sql));
  const done = all.filter(p => ASN.isDone(p.file)).length;
  const starred = all.filter(p => ASN.isStar(p.file)).length;
  document.getElementById('heroStats').innerHTML =
    `<div class="hero-stat"><b>${implemented(ASN.PROBLEMS.algo).length}</b><span>算法题</span></div>` +
    `<div class="hero-stat"><b>${implemented(ASN.PROBLEMS.sql).length}</b><span>SQL 题</span></div>` +
    `<div class="hero-stat"><b>${done}</b><span>已阅读</span></div>` +
    `<div class="hero-stat"><b>${starred}</b><span>已收藏</span></div>`;
}

function card(p) {
  const li = document.createElement('li');
  li.className = 'prob-card';
  const a = document.createElement('a');
  a.className = 'prob-card-link';
  a.href = p.file;

  const top = document.createElement('div');
  top.className = 'prob-card-top';
  const num = document.createElement('span');
  num.className = 'prob-card-num';
  num.textContent = String(p.id).padStart(3, '0');
  top.appendChild(num);
  if (ASN.isDone(p.file)) {
    const check = document.createElement('span');
    check.className = 'prob-check';
    check.textContent = '✓';
    top.appendChild(check);
  }
  const title = document.createElement('span');
  title.className = 'prob-card-title';
  title.textContent = p.title;
  top.appendChild(title);
  a.appendChild(top);

  const meta = document.createElement('div');
  meta.className = 'prob-card-meta';
  const diff = document.createElement('span');
  diff.className = `tag-badge ${DIFF_CLASS[p.diff]}`;
  diff.textContent = DIFF_MAP[p.diff];
  meta.appendChild(diff);
  (p.tags || []).slice(0, 2).forEach(t => {
    const tag = document.createElement('span');
    tag.className = 'tag-badge tag-ds';
    tag.textContent = t;
    meta.appendChild(tag);
  });
  a.appendChild(meta);
  li.appendChild(a);

  const star = document.createElement('button');
  star.type = 'button';
  star.className = 'prob-star' + (ASN.isStar(p.file) ? ' on' : '');
  star.textContent = ASN.isStar(p.file) ? '★' : '☆';
  star.setAttribute('aria-label', '收藏 ' + p.title);
  star.addEventListener('click', () => {
    const on = ASN.toggleStar(p.file);
    star.textContent = on ? '★' : '☆';
    star.classList.toggle('on', on);
    renderStats();
  });
  li.appendChild(star);
  return li;
}

function renderGrid(listEl, countEl, problems) {
  listEl.innerHTML = '';
  const filtered = problems.filter(matches);
  countEl.textContent = filtered.length + ' / ' + problems.length;
  filtered.forEach(p => listEl.appendChild(card(p)));
}

function renderAll() {
  const algo = implemented(ASN.PROBLEMS.algo);
  const sql = implemented(ASN.PROBLEMS.sql);
  renderGrid(document.getElementById('algoGrid'), document.getElementById('algoCount'), algo);
  renderGrid(document.getElementById('sqlGrid'), document.getElementById('sqlCount'), sql);
  const any = algo.some(matches) || sql.some(matches);
  document.getElementById('emptyState').style.display = any ? 'none' : 'block';
  renderStats();
}

window.addEventListener('asn:search', e => { query = e.detail || ''; renderAll(); });
window.addEventListener('asn:star', () => renderAll());

renderAll();
</script>
</body>
</html>
