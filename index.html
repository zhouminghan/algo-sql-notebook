<script>
(function() {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  function apply(theme) { document.documentElement.setAttribute('data-theme', theme); localStorage.setItem('theme', theme); }
  const s = localStorage.getItem('theme');
  if (s) apply(s); else if (mq.matches) apply('dark'); else apply('light');

})();

];

let activeTab = 'algo';

function renderProblems(tab) {
  const all = tab === 'algo' ? algoProblems : sqlProblems;
  // 只显示有 HTML 文件的题目
  const problems = all.filter(p => p.file);
  const list = document.getElementById('problemList');
  const empty = document.getElementById('emptyState');
  list.innerHTML = '';

  if (!problems.length) {
    empty.style.display = 'block';
    list.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  list.style.display = 'block';

  problems.forEach(p => {
    const li = document.createElement('li');

    // 题号
    const numSpan = document.createElement('span');
    numSpan.className = 'prob-num';
    numSpan.textContent = String(p.id).padStart(3, '0');
    li.appendChild(numSpan);

    // 标题
    if (p.file) {
      const link = document.createElement('a');
      link.href = p.file;
      link.textContent = p.title;
      li.appendChild(link);
    } else {
      const span = document.createElement('span');
      span.textContent = p.title;
      span.style.color = 'var(--color-neutral)';
      li.appendChild(span);
    }

    // 难度列
    const diffCol = document.createElement('span');
    diffCol.className = 'difficulty-col';
    const diffSpan = document.createElement('span');
    diffSpan.className = `tag-badge ${DIFF_CLASS[p.diff]}`;
    diffSpan.textContent = DIFF_MAP[p.diff];
    diffCol.appendChild(diffSpan);
    li.appendChild(diffCol);

    // 标签列
    const tagsCol = document.createElement('span');
    tagsCol.className = 'tags-col';
    p.tags.forEach(tag => {
      const tagSpan = document.createElement('span');
      tagSpan.className = 'tag-badge tag-ds';
      tagSpan.textContent = tag;
      tagsCol.appendChild(tagSpan);
    });
    li.appendChild(tagsCol);

    list.appendChild(li);
  });
}

document.getElementById('topTabBar').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  const tab = e.target.dataset.tab;
  if (!tab || tab === activeTab) return;
  activeTab = tab;
  document.querySelectorAll('#topTabBar button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  renderProblems(tab);
});
